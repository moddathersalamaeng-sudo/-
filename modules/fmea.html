<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="FMEA — failure mode and effects analysis: a structured, team-based look ahead at how each process step (or design function) can fail, the effect on the customer or the next step, the causes and the prevention and detection controls. Written 1–10 scales agreed before the rating, the risk priority number and the action priority computed by a written rule (high severity first), actions with an owner and a date, re-rating with evidence (severity falls only with a design or process change), dated reviews, a severity × occurrence heat map. Starts read-only from DMAIC, RCA or Pareto. ISO 10009:2024 7.3; serves ISO 9001:2026 clauses 6.1, 8.5.1 g), 8.5.6 and 10.2. Continual Improvement Academy.">
<title>FMEA | Continual Improvement Academy — مدثر سلامه</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@500;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --bg:#F3F7FB; --surface:#FFFFFF; --ink:#1B2A4A; --ink-soft:#4B5874; --muted:#5B677F; --line:#DCE4EE;
  --gold:#B8901E; --gold-tint:#FBF4DF;
  --plan:#1E8C93; --plan-t:#E3F4F4; --do:#3563C9; --do-t:#E7EEFB; --check:#C9821A; --check-t:#FCF1DE;
  --act:#3C9A5F; --act-t:#E5F4EA; --lead:#1B2A4A; --lead-t:#E6EAF2; --ctx:#7B5BB8; --ctx-t:#EFEAF8;
  --new:#C2410C; --new-t:#FDECE3;
  --radius-lg:22px; --radius:14px; --radius-sm:9px;
  --display:"Noto Kufi Arabic","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
}
html[lang="en"]{--display:"Fraunces",Georgia,serif;--body:"IBM Plex Sans","Segoe UI",Helvetica,sans-serif}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16.5px;line-height:1.8}
html[lang="en"] body{font-size:16px;line-height:1.65}
img,svg{max-width:100%}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:6px}
.wrap{max-width:1180px;margin-inline:auto;padding-inline:22px}

.topbar{background:var(--surface);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand-mark{width:42px;height:42px;border-radius:12px;background:var(--ink);display:grid;place-items:center;color:#fff;font-family:Georgia,serif;font-weight:700;font-size:13px}
.brand b{font-family:var(--display);font-size:15px;display:block;line-height:1.4}
.brand span{font-size:13px;color:var(--muted)}
.bar-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.nav{display:flex;gap:4px;flex-wrap:wrap}
.nav a{color:var(--ink-soft);text-decoration:none;font-size:14px;padding:6px 12px;border-radius:999px}
.nav a:hover{background:var(--bg);color:var(--ink)}
.lang{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--ink);background:var(--ink);color:#fff;border-radius:999px;padding:7px 16px;font-size:14px;font-weight:600;cursor:pointer}
.lang:hover{background:#27395f}
.lang svg{flex:none}

.hero{padding:44px 0 18px}
.hero-grid{display:grid;gap:10px;text-align:center}
.std-code{font-family:Georgia,"Times New Roman",serif;font-weight:700;font-size:clamp(44px,7vw,78px);line-height:1;letter-spacing:-1px;direction:ltr}
.std-code small{display:block;font-size:.26em;letter-spacing:0;color:var(--gold);font-weight:400;margin-top:10px;font-family:var(--body)}
.hero h1{font-family:var(--display);font-weight:800;font-size:clamp(24px,3.4vw,38px);margin:14px 0 4px;line-height:1.4}
html[lang="en"] .hero h1{font-weight:700}
.hero .lede{max-width:64ch;margin:0 auto;color:var(--ink-soft);font-size:17px}
.edition-tag{display:inline-flex;align-items:center;gap:10px;margin:16px auto 0;background:var(--gold-tint);border:1px solid #EFDFAF;color:#7A5E10;padding:7px 16px;border-radius:999px;font-weight:600;font-size:14.5px}
.edition-tag i{width:8px;height:8px;border-radius:50%;background:var(--gold)}
.author{margin-top:14px;font-size:15px;color:var(--muted)}
.author strong{color:var(--ink);font-family:var(--display);font-size:18px;margin-inline-start:6px}

.stage{background:var(--surface);border:1px solid var(--line);border-radius:28px;margin-top:26px;padding:22px 18px 18px;position:relative;overflow:hidden}
.stage-head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;padding:0 8px 6px}
.stage-head h2{font-family:var(--display);font-size:22px;margin:0}
.stage-head p{margin:0;color:var(--ink-soft);font-size:15px}
.hint{display:inline-flex;gap:8px;align-items:center;font-size:14px;color:var(--ink-soft);background:var(--bg);border-radius:999px;padding:6px 14px}
#pdca{display:block;width:100%;height:auto;max-height:640px;margin-inline:auto}
#pdca .seg{cursor:pointer;transition:transform .25s ease, filter .25s ease;transform-origin:450px 320px}
#pdca .seg:hover,#pdca .seg:focus-visible{transform:scale(1.035);filter:drop-shadow(0 8px 14px rgba(27,42,74,.18))}
#pdca .seg:focus{outline:none}
#pdca .seg:focus-visible .seg-shape{stroke:var(--gold);stroke-width:4}
#pdca text{font-family:var(--body);pointer-events:none}
#pdca .num{font-family:Georgia,serif;font-weight:700}
.pulse{animation:pulse 2.4s ease-in-out 1s 3}
@keyframes pulse{0%,100%{stroke-opacity:1}50%{stroke-opacity:.2}}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:center;padding:8px 0 4px;font-size:14px;color:var(--ink-soft)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{width:12px;height:12px;border-radius:4px}

.index{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-top:16px}
.index button{all:unset;cursor:pointer;background:var(--bg);border-radius:var(--radius);padding:12px 14px;display:flex;gap:12px;align-items:center;border:1px solid transparent;transition:border-color .2s, background .2s}
.index button:hover{background:#fff;border-color:var(--line)}
.index button:focus-visible{outline:3px solid var(--gold)}
.index .n{font-family:Georgia,serif;font-weight:700;font-size:26px;line-height:1;min-width:30px;text-align:center}
.index .t{font-size:14.5px;font-weight:600;line-height:1.45}

.search{margin-top:18px;position:relative}
.search input{width:100%;font:inherit;font-size:16px;padding:14px 16px;padding-inline-start:48px;border-radius:var(--radius);border:1.5px solid var(--line);background:#fff;color:var(--ink)}
.search input:focus{outline:none;border-color:var(--plan);box-shadow:0 0 0 4px var(--plan-t)}
.search > svg{position:absolute;inset-inline-start:16px;top:50%;transform:translateY(-50%);color:var(--muted)}
.results{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:6px}
.results button{all:unset;cursor:pointer;display:flex;gap:12px;align-items:baseline;width:100%;box-sizing:border-box;padding:10px 14px;border-radius:var(--radius-sm);background:#fff;border:1px solid var(--line)}
.results button:hover{border-color:var(--plan)}
.results .rn{font-family:Georgia,serif;font-weight:700;color:var(--plan);direction:ltr;min-width:56px}
.results .rt{font-weight:600}
.results .rs{color:var(--muted);font-size:13.5px}
.results .empty{padding:10px 14px;color:var(--ink-soft);background:#fff;border-radius:var(--radius-sm)}

section.block{padding:54px 0 10px}
.sec-title{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.sec-title h2{font-family:var(--display);font-size:clamp(22px,2.6vw,30px);margin:0;line-height:1.4}
.sec-title p{margin:0;color:var(--ink-soft);max-width:72ch}
.rule{height:3px;width:56px;background:var(--gold);border-radius:3px;margin-bottom:10px}

.changes{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:16px}
.change{background:var(--surface);border-radius:var(--radius-lg);padding:22px;border:1px solid var(--line);display:grid;grid-template-columns:52px 1fr;gap:14px;align-items:start}
.change .ic{width:52px;height:52px;border-radius:16px;display:grid;place-items:center}
.change h3{margin:0 0 4px;font-size:17.5px;font-family:var(--display);line-height:1.45}
.change p{margin:0;color:var(--ink-soft);font-size:15px}
.change .refs{margin-top:10px;display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--bg);color:var(--ink-soft);direction:ltr;cursor:pointer;border:0}
.chip:hover{background:var(--plan-t);color:var(--plan)}

.gl-tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.gl-tools input{flex:1;min-width:220px;font:inherit;padding:11px 14px;border-radius:var(--radius-sm);border:1.5px solid var(--line)}
.gl-tools input:focus{outline:none;border-color:var(--plan);box-shadow:0 0 0 4px var(--plan-t)}
.glossary{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.term{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px}
.term header{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.term h4{margin:0;font-size:17px;font-family:var(--display)}
.term .en{direction:ltr;font-family:Georgia,serif;color:var(--plan);font-size:15px}
.term .ref{font-size:12px;color:var(--muted);direction:ltr}
.term p{margin:6px 0 0;color:var(--ink-soft);font-size:15px}

.pairs{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px}
.pair{background:#fff;border-radius:var(--radius-lg);border:1px solid var(--line);overflow:hidden}
.pair h3{margin:0;padding:14px 20px;font-size:16px;font-family:var(--display);background:var(--bg);border-bottom:1px solid var(--line)}
.pair dl{margin:0;padding:6px 20px 16px}
.pair dt{font-weight:700;margin-top:10px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.pair dt span{direction:ltr;font-family:Georgia,serif;color:var(--gold);font-weight:400;font-size:14.5px}
.pair dd{margin:2px 0 0;color:var(--ink-soft);font-size:15px}

.timeline{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));background:#fff;border-radius:var(--radius-lg);border:1px solid var(--line);overflow:hidden}
.timeline li{padding:22px 20px;border-inline-start:1px solid var(--line)}
.timeline li:first-child{border-inline-start:0}
.timeline .when{font-family:var(--display);font-weight:700;font-size:18px;color:var(--plan)}
.timeline .what{color:var(--ink-soft);font-size:15px}
.timeline .step{width:30px;height:30px;border-radius:50%;background:var(--plan-t);color:var(--plan);display:grid;place-items:center;font-weight:700;font-size:14px;margin-bottom:8px}
.note{margin-top:14px;background:var(--gold-tint);border-inline-start:4px solid var(--gold);padding:12px 16px;border-radius:var(--radius-sm);font-size:15px;color:#5E4A12}

footer{margin-top:60px;background:var(--surface);border-top:1px solid var(--line);padding:28px 0 34px;font-size:14px;color:var(--muted)}
footer .wrap{display:grid;gap:10px}
footer strong{color:var(--ink);font-family:var(--display);font-size:16px}

.scrim{position:fixed;inset:0;background:rgba(27,42,74,.32);opacity:0;pointer-events:none;transition:opacity .25s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;inset-inline-start:0;width:min(820px,100%);background:var(--bg);z-index:50;transform:translateX(-104%);transition:transform .35s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;box-shadow:0 0 40px rgba(27,42,74,.18)}
html[dir="rtl"] .drawer{transform:translateX(104%)}
.drawer.on,html[dir="rtl"] .drawer.on{transform:none}
.d-head{padding:22px 26px 20px;color:#fff;position:relative}
.d-head .row{display:flex;gap:18px;align-items:center}
.d-num{font-family:Georgia,serif;font-weight:700;font-size:64px;line-height:.9}
.d-phase{display:inline-block;font-size:13px;font-weight:600;background:rgba(255,255,255,.2);padding:3px 12px;border-radius:999px;margin-bottom:4px}
.d-title{font-family:var(--display);font-size:clamp(20px,3vw,28px);margin:0;line-height:1.35}
.d-lang{position:absolute;inset-inline-end:68px;top:18px;height:40px;display:inline-flex;align-items:center;gap:7px;border:0;border-radius:12px;background:rgba(255,255,255,.18);color:#fff;cursor:pointer;padding:0 14px;font-size:13.5px;font-weight:600}
.d-lang:hover{background:rgba(255,255,255,.3)}
.d-close{position:absolute;inset-inline-end:18px;top:18px;width:40px;height:40px;border-radius:12px;border:0;background:rgba(255,255,255,.18);color:#fff;cursor:pointer;display:grid;place-items:center}
.d-close:hover{background:rgba(255,255,255,.3)}
.d-body{overflow-y:auto;padding:22px 26px 30px;flex:1}
.d-intro{font-size:16.5px;color:var(--ink-soft);margin:0 0 16px}
.illo{background:#fff;border:1px solid var(--line);border-radius:var(--radius-lg);padding:14px;margin:0 0 18px;overflow-x:auto}
.illo figcaption{font-size:13.5px;color:var(--muted);text-align:center;margin-top:6px}
.illo svg{display:block;width:100%;height:auto}
.illo svg text{font-family:var(--body)}
.d-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.tbtn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:6px 14px;font-size:14px;cursor:pointer}
.tbtn[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.d-tools .count{margin-inline-start:auto;font-size:13.5px;color:var(--muted)}

.sub{background:#fff;border:1px solid var(--line);border-radius:var(--radius);margin-bottom:10px;overflow:hidden}
.sub > button{all:unset;box-sizing:border-box;cursor:pointer;width:100%;display:flex;align-items:center;gap:12px;padding:14px 16px}
.sub > button:focus-visible{outline:3px solid var(--gold);outline-offset:-3px}
.sub .sn{font-family:Georgia,serif;font-weight:700;direction:ltr;min-width:62px;text-align:center;padding:4px 8px;border-radius:8px;font-size:15px}
.sub .st{font-weight:700;font-size:16px;flex:1;line-height:1.4}
.badge{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
.badge.new{background:var(--new-t);color:var(--new)}
.badge.upd{background:var(--gold-tint);color:#86680F}
.chev{transition:transform .25s;color:var(--muted);flex:none}
.sub.open .chev{transform:rotate(180deg)}
.sub-body{display:none;padding:0 16px 16px}
.sub.open .sub-body{display:block}
.panes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pane{border-radius:12px;padding:14px 16px}
.pane h5{margin:0 0 6px;font-size:14.5px;display:flex;align-items:center;gap:8px;font-family:var(--display)}
.pane p{margin:0;font-size:15.5px}
.pane.req{background:var(--bg);grid-column:1/-1}
.pane.ex{background:var(--act-t)} .pane.ex h5{color:var(--act)}
.pane.how{background:var(--do-t)} .pane.how h5{color:var(--do)}
.pane ol{margin:0;padding-inline-start:0;list-style:none;counter-reset:s}
.pane ol li{counter-increment:s;position:relative;padding-inline-start:32px;margin-bottom:6px;font-size:15px;line-height:1.6}
.pane ol li::before{content:counter(s);position:absolute;inset-inline-start:0;top:2px;width:22px;height:22px;border-radius:50%;background:var(--do);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center}
.pane.ev{grid-column:1/-1;background:var(--check-t)} .pane.ev h5{color:#9A6210}
.ev-list{display:flex;flex-wrap:wrap;gap:6px}
.ev-list span{background:#fff;border-radius:8px;padding:4px 10px;font-size:14px;border:1px solid #F2DDB6}
.tip{grid-column:1/-1;background:var(--gold-tint);border-inline-start:4px solid var(--gold);border-radius:10px;padding:10px 14px;font-size:15px;color:#5E4A12}
.d-foot{display:flex;justify-content:space-between;gap:10px;padding:14px 26px;border-top:1px solid var(--line);background:#fff}
.d-foot button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 16px;cursor:pointer;font-size:14.5px;color:var(--ink)}
.d-foot button:hover{border-color:var(--ink-soft)}
.d-foot button[disabled]{opacity:.4;cursor:default}
body.lock{overflow:hidden}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

@media (max-width:720px){
  .panes{grid-template-columns:1fr}
  .d-head,.d-body{padding-inline:18px}
  .d-num{font-size:48px}
  .illo svg{min-width:560px}
  .nav{display:none}
  .timeline li{border-inline-start:0;border-top:1px solid var(--line)}
  .timeline li:first-child{border-top:0}
}
@media print{.topbar,.search,.scrim,.drawer,.hint{display:none!important}body{background:#fff}}
/* ===== Toolkit additions ===== */
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
.topbar{position:relative;z-index:30}
.nav a.tool{color:var(--ink);font-weight:600}
.launch{padding:6px 0 4px}
.launch-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.launch a{display:grid;grid-template-columns:46px 1fr;gap:12px;align-items:center;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;transition:border-color .2s}
.launch a:hover{border-color:var(--gold)}
.launch .li{width:46px;height:46px;border-radius:13px;display:grid;place-items:center}
.launch b{display:block;font-family:var(--display);font-size:15.5px;line-height:1.4}
.launch small{color:var(--ink-soft);font-size:13.5px;line-height:1.45;display:block}
.tk-panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:20px}
.tk-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tk-btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:8px 16px;font-size:14px;cursor:pointer;font-weight:600;display:inline-flex;gap:7px;align-items:center}
.tk-btn:hover{border-color:var(--ink-soft)}
.tk-btn.pri{background:var(--ink);border-color:var(--ink);color:#fff}
.tk-btn.pri:hover{background:#27395f}
.tk-btn.gold{background:var(--gold);border-color:var(--gold);color:#fff}
.tk-btn[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.tk-btn.sm{padding:5px 12px;font-size:13px}
.tk-field{display:grid;gap:4px;font-size:13.5px;color:var(--ink-soft);min-width:0}
.tk-field input,.tk-field select,.tk-in{font:inherit;font-size:15px;color:var(--ink);padding:9px 12px;border-radius:var(--radius-sm);border:1.5px solid var(--line);background:#fff;min-width:0;width:100%}
.tk-field input:focus,.tk-field select:focus,.tk-in:focus,textarea.tk-in:focus{outline:none;border-color:var(--plan);box-shadow:0 0 0 3px var(--plan-t)}
.tk-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.tk-muted{color:var(--muted);font-size:13.5px}
.toast{position:fixed;inset-inline:0;bottom:calc(18px + env(safe-area-inset-bottom,0px));margin:auto;width:max-content;max-width:90vw;background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;z-index:80;opacity:0;transform:translateY(10px);transition:.25s;pointer-events:none}
.toast.on{opacity:1;transform:none}

/* access */
.acc-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px}
.smap{list-style:none;margin:0;padding:0}
.smap li{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;padding:11px 4px;border-top:1px solid var(--line)}
.smap li:first-child{border-top:0}
.smap .no{font-family:Georgia,serif;font-weight:700;font-size:20px;text-align:center;direction:ltr}
.smap .tt{font-weight:700;line-height:1.4}
.smap .tt small{display:block;font-weight:400;color:var(--ink-soft);font-size:14px;line-height:1.5}
.smap .pg{font-size:12px;color:var(--muted);direction:ltr;margin-inline-start:6px;font-weight:500}
.src{display:grid;gap:10px}
.src a{display:block;text-decoration:none;color:var(--ink);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;background:var(--bg)}
.src a:hover{border-color:var(--plan)}
.src a b{font-family:var(--display);font-size:15px}
.src a span{display:block;font-size:13.5px;color:var(--ink-soft);line-height:1.5}
.companions{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin-top:16px}
.comp{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.comp b{font-family:Georgia,serif;direction:ltr;display:inline-block;color:var(--plan)}
.comp h4{margin:2px 0 4px;font-size:15.5px;font-family:var(--display)}
.comp p{margin:0;font-size:14px;color:var(--ink-soft);line-height:1.6}

/* self assessment */
.as-top{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.dom-tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.dom-tabs button{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-size:13.5px;cursor:pointer;color:var(--ink-soft);font-weight:600;display:inline-flex;gap:8px;align-items:center}
.dom-tabs button[aria-selected="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.dom-tabs .pc{font-size:11.5px;border-radius:999px;padding:1px 7px;background:var(--bg);color:var(--ink-soft)}
.dom-tabs button[aria-selected="true"] .pc{background:rgba(255,255,255,.2);color:#fff}
.aq{border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-top:10px;background:#fff}
.aq-h{display:flex;gap:10px;align-items:flex-start}
.aq-h .cl{font-family:Georgia,serif;font-weight:700;font-size:13px;direction:ltr;background:var(--bg);border-radius:7px;padding:2px 8px;white-space:nowrap;margin-top:3px}
.aq-h p{margin:0;font-weight:600;line-height:1.6;flex:1}
.scale{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:10px}
.scale button{overflow-wrap:anywhere;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:7px 4px;font-size:12.5px;cursor:pointer;line-height:1.35;color:var(--ink-soft);font-family:inherit}
.scale button b{display:block;font-family:Georgia,serif;font-size:17px;color:var(--ink)}
.scale button[aria-pressed="true"]{border-color:var(--sc);background:var(--sct);color:var(--ink)}
.scale button[aria-pressed="true"] b{color:var(--sc)}
.as-nav{display:flex;justify-content:space-between;gap:10px;margin-top:14px;flex-wrap:wrap}
.res{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:16px;margin-top:16px}
.gauge{display:grid;justify-items:center;text-align:center;gap:6px}
.gauge .band{font-family:var(--display);font-weight:700;font-size:19px}
.gauge p{margin:0;color:var(--ink-soft);font-size:14.5px;max-width:42ch}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:100%;margin-top:6px}
.kpis div{background:var(--bg);border-radius:10px;padding:8px}
.kpis b{display:block;font-family:Georgia,serif;font-size:20px;direction:ltr}
.kpis span{font-size:12.5px;color:var(--ink-soft)}
.bars{display:grid;gap:9px}
.bar{display:grid;grid-template-columns:minmax(120px,1.1fr) minmax(0,2fr) 44px;gap:10px;align-items:center;font-size:14px}
.bar .tr{height:12px;background:var(--bg);border-radius:99px;overflow:hidden}
.bar .fl{height:100%;border-radius:99px;transition:width .5s}
.bar .v{font-family:Georgia,serif;font-weight:700;direction:ltr;text-align:end}
.radar-wrap svg{width:100%;height:auto;max-width:430px;display:block;margin:auto}
.plan-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-top:22px}
.plan-h h3{font-family:var(--display);margin:0;font-size:20px}
.gantt{overflow-x:auto;margin-top:10px;background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:10px}
.gantt svg{display:block;min-width:640px;width:100%;height:auto}
.phase{margin-top:14px;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:#fff}
.phase-h{display:flex;gap:10px;align-items:center;padding:11px 16px;background:var(--bg);flex-wrap:wrap}
.phase-h b{font-family:var(--display);font-size:15.5px}
.phase-h .dt{margin-inline-start:auto;font-size:13px;color:var(--ink-soft);direction:ltr}
.act{display:grid;grid-template-columns:auto 1fr;gap:10px 12px;padding:12px 16px;border-top:1px solid var(--line)}
.pr{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;height:max-content}
.pr.H{background:#FDECE3;color:#C2410C}.pr.M{background:var(--gold-tint);color:#86680F}.pr.L{background:var(--act-t);color:var(--act)}
.act p{margin:0;font-weight:600;line-height:1.55}
.act .meta{grid-column:2;display:flex;gap:6px 14px;flex-wrap:wrap;font-size:13px;color:var(--ink-soft)}
.act .meta .chip{font-size:12px}
.empty-plan{padding:18px;text-align:center;color:var(--ink-soft)}

/* checklist */
.ck-sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin:14px 0}
.ck-sum div{border-radius:12px;padding:10px 12px;background:var(--bg)}
.ck-sum b{display:block;font-family:Georgia,serif;font-size:22px;direction:ltr}
.ck-sum span{font-size:12.5px;color:var(--ink-soft)}
.ck-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.ck-tools select,.ck-tools input{font:inherit;font-size:14px;padding:7px 12px;border-radius:999px;border:1.5px solid var(--line);background:#fff;color:var(--ink)}
.ck-tools input{flex:1;min-width:180px}
.ck-cl{margin-top:18px}
.ck-cl > h3{font-family:var(--display);font-size:18px;margin:0 0 8px;display:flex;gap:10px;align-items:center}
.ck-cl > h3 i{font-style:normal;font-family:Georgia,serif;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#fff;font-size:16px}
.ck{background:#fff;border:1px solid var(--line);border-radius:var(--radius);margin-bottom:8px;overflow:hidden}
.ck-h{display:flex;gap:10px;align-items:center;padding:11px 14px;cursor:pointer}
.ck-h .sn{font-family:Georgia,serif;font-weight:700;direction:ltr;min-width:58px;text-align:center;padding:3px 6px;border-radius:8px;font-size:14px;background:var(--bg)}
.ck-h .st{font-weight:700;flex:1;line-height:1.4;font-size:15px}
.stpill{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap;background:var(--bg);color:var(--muted)}
.ck-b{display:none;padding:0 14px 14px}
.ck.open .ck-b{display:block}
.ck.open .chev{transform:rotate(180deg)}
.ck-b .req{background:var(--bg);border-radius:10px;padding:10px 12px;font-size:14.5px;color:var(--ink-soft);margin-bottom:10px}
.ck-b h5{margin:10px 0 6px;font-size:14px;font-family:var(--display)}
.ck-b ol{margin:0;padding-inline-start:22px}
.ck-b ol li{margin-bottom:4px;font-size:15px}
.stat-btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.stat-btns button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;font-weight:600;color:var(--ink-soft);font-family:inherit}
.stat-btns button[aria-pressed="true"]{color:#fff}
textarea.tk-in{resize:vertical;min-height:62px;margin-top:10px;font-size:14.5px}
.legend-cls{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:12px}
.legend-cls div{border-radius:12px;padding:10px 12px;font-size:14px;border-inline-start:4px solid}
.legend-cls b{display:block;font-family:var(--display)}

/* templates */
.tp-list{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tp-list button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:8px 12px;font-size:13.5px;cursor:pointer;color:var(--ink);text-align:start;display:flex;gap:8px;align-items:center;font-family:inherit}
.tp-list button span{font-family:Georgia,serif;direction:ltr;font-size:12px;color:var(--muted)}
.tp-list button[aria-selected="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.tp-list button[aria-selected="true"] span{color:#cfd6e4}
.tp-head{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.tp-head h3{font-family:var(--display);font-size:21px;margin:0;line-height:1.4}
.tp-head p{margin:6px 0 0;color:var(--ink-soft);max-width:80ch}
.tp-tips{margin:12px 0;padding:12px 16px;background:var(--gold-tint);border-radius:12px;font-size:14.5px;color:#5E4A12}
.tp-tips ul{margin:4px 0 0;padding-inline-start:20px}
.tp-bar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.tp-tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius)}
.tp-tbl table{border-collapse:collapse;width:100%;font-size:14px}
.tp-tbl th{background:var(--ink);color:#fff;font-weight:600;padding:9px 10px;text-align:start;white-space:nowrap;font-size:13px;position:sticky;top:0}
.tp-tbl td{border-top:1px solid var(--line);padding:0;vertical-align:top;background:#fff}
.tp-tbl tr:nth-child(even) td{background:#FAFCFE}
.tp-tbl [contenteditable]{padding:8px 10px;min-height:38px;outline:none;line-height:1.55}
.tp-tbl [contenteditable]:focus{background:var(--plan-t);box-shadow:inset 0 0 0 2px var(--plan)}
.tp-tbl select{font:inherit;font-size:13.5px;border:0;background:transparent;padding:8px 6px;width:100%;color:var(--ink);cursor:pointer}
.tp-tbl .calc{padding:8px 10px;font-weight:700;text-align:center;direction:ltr}
.tp-tbl .del{border:0;background:none;color:var(--muted);cursor:pointer;padding:8px;font-size:16px}
.tp-tbl .del:hover{color:#C2410C}
.rt{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700}
.heat{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;margin-top:14px;align-items:start}
.heat svg{width:100%;max-width:380px;height:auto;display:block}
.swot{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.quad{border-radius:var(--radius);padding:14px;border:1px solid}
.quad h4{margin:0 0 8px;font-family:var(--display);font-size:16px}
.quad ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.quad li{display:flex;gap:6px;align-items:flex-start;background:#fff;border-radius:9px}
.quad li [contenteditable]{flex:1;padding:7px 10px;outline:none;font-size:14.5px;line-height:1.5;min-height:34px}
.quad li [contenteditable]:focus{box-shadow:inset 0 0 0 2px var(--plan);border-radius:9px}
.quad .del{border:0;background:none;color:var(--muted);cursor:pointer;padding:6px 8px}
.quad .add{margin-top:8px;border:1px dashed currentColor;background:transparent;border-radius:9px;padding:6px 10px;cursor:pointer;font-size:13px;font-family:inherit;width:100%}
.turtle{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tb{border:1px solid var(--line);border-radius:var(--radius);background:#fff;overflow:hidden}
.tb h5{margin:0;padding:8px 12px;font-size:13.5px;background:var(--bg);font-family:var(--display)}
.tb [contenteditable]{padding:10px 12px;min-height:70px;outline:none;font-size:14.5px;line-height:1.55}
.tb [contenteditable]:focus{box-shadow:inset 0 0 0 2px var(--plan)}
.tb.center{background:var(--ink);border-color:var(--ink)}
.tb.center h5{background:rgba(255,255,255,.12);color:#fff}
.tb.center [contenteditable]{color:#fff;font-family:var(--display);font-weight:700;font-size:17px;display:grid;place-items:center;text-align:center}
.drawer .ck-link{margin-inline-start:0}

@media (max-width:860px){
  .acc-grid,.res,.heat{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:720px){
  .swot,.turtle{grid-template-columns:minmax(0,1fr)}
  .scale{grid-template-columns:repeat(5,minmax(0,1fr))}
  .scale button{font-size:11px;padding:6px 2px}
  .bar{grid-template-columns:minmax(0,1fr) 44px}
  .bar .tr{grid-column:1/-1;grid-row:2}
  .smap li{grid-template-columns:48px 1fr}
  .smap li .tk-btn{grid-column:2;justify-self:start}
  .kpis{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media print{
  .launch,.tk-row .tk-btn,.tp-bar,.ck-tools,.as-nav,.dom-tabs{display:none!important}
}

/* ===== Tabbed app layout ===== */
.topbar .nav{display:none!important}
.topbar .wrap{max-width:1440px}
.app{display:grid;grid-template-columns:272px minmax(0,1fr);gap:22px;max-width:1440px;margin:0 auto;padding:18px 22px 0}
.side{position:sticky;top:14px;align-self:start;max-height:calc(100vh - 28px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:10px;scrollbar-width:thin}
.side .sg{font-size:12px;color:var(--muted);font-weight:700;padding:14px 12px 4px}
.side button{display:flex;gap:10px;align-items:center;width:100%;border:0;background:none;padding:9px 10px;border-radius:12px;cursor:pointer;text-align:start;font:inherit;font-size:14.5px;color:var(--ink);font-weight:600;line-height:1.35}
.side button:hover{background:var(--bg)}
.side button[aria-selected="true"]{background:var(--ink);color:#fff}
.side button[aria-selected="true"] .ic{background:rgba(255,255,255,.14)!important;color:#fff!important}
.side .ic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;flex:none}
.side .tl{flex:1}
.side .bd{font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 8px;background:var(--gold-tint);color:#7A5E10;direction:ltr;white-space:nowrap}
.side button[aria-selected="true"] .bd{background:var(--gold);color:#fff}
#main{min-width:0}
#main .wrap{max-width:none;padding-inline:0}
#main section.block{padding:4px 0 10px}
.tabpane{display:none;animation:tabIn .25s ease}
.tabpane.on{display:block}
@keyframes tabIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#main .hero{padding:26px 0 18px}
#main footer{margin-top:40px;border-radius:var(--radius-lg) var(--radius-lg) 0 0;border:1px solid var(--line);border-bottom:0;padding-inline:22px}
.launch-grid{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.as-mini{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:10px 16px;margin-bottom:14px}
.as-mini .mini-t{display:grid;flex:1;min-width:150px;line-height:1.5}
.as-mini .mini-t b{font-family:var(--display);font-size:17px}
.as-mini svg text{font-size:34px}
/* standard viewer */
.acc-grid{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);align-items:start}
.vp{position:relative;background-color:#fff;background-repeat:repeat;border:1px solid var(--line);border-radius:6px;box-shadow:0 10px 30px rgba(27,42,74,.10);padding:34px 34px 30px;user-select:none;-webkit-user-select:none;overflow:hidden}
.vp::before{content:"";position:absolute;inset:0;border-top:6px solid var(--ink);pointer-events:none}
.vp-stamp{position:absolute;top:16px;inset-inline-end:16px;border:2px solid #C2410C;color:#C2410C;border-radius:8px;padding:3px 12px;font-weight:800;font-size:13px;transform:rotate(-6deg);background:rgba(255,255,255,.85)}
.vp-head{border-bottom:2px solid var(--gold);padding-bottom:14px;margin-bottom:10px}
.vp-code{font-family:Georgia,serif;font-weight:700;font-size:30px;direction:ltr;text-align:start}
.vp-t{font-family:var(--display);font-weight:700;font-size:18px}
.vp-s{font-size:13px;color:var(--muted)}
.vp-cl{padding:12px 0;border-bottom:1px dashed var(--line)}
.vp-cl h4{margin:0;display:flex;gap:10px;align-items:baseline;font-family:var(--display);font-size:17px}
.vp-cl h4 span{font-family:Georgia,serif;font-size:20px;min-width:30px}
.vp-cl h4 em,.vp-cl li em{margin-inline-start:auto;font-style:normal;font-size:12px;color:var(--muted);direction:ltr;white-space:nowrap;font-family:var(--body);font-weight:500}
.vp-sum{margin:4px 0 0;padding-inline-start:40px;font-size:14px;color:var(--ink-soft)}
.vp-cl ul{list-style:none;margin:6px 0 0;padding:0}
.vp-cl li button{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:10px;align-items:flex-start;width:100%;padding:7px 8px 7px 0;border-radius:8px}
html[dir="rtl"] .vp-cl li button{padding:7px 0 7px 8px}
.vp-cl li button:hover{background:rgba(227,244,244,.7)}
.vp-cl li button:focus-visible{outline:3px solid var(--gold)}
.vp-cl li b{font-family:Georgia,serif;direction:ltr;min-width:58px;font-size:14px;padding-top:2px}
.vp-cl li strong{display:block;font-size:15px;line-height:1.45}
.vp-cl li small{display:block;font-size:13.5px;color:var(--ink-soft);line-height:1.55}
.vp-cl li span{flex:1}
/* transition */
#transition .timeline{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.h3x{font-family:var(--display);font-size:19px;margin:24px 0 10px}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.rule-c{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;border-inline-start:4px solid var(--plan)}
.rule-c b{font-family:var(--display);font-size:15.5px}
.rule-c p{margin:4px 0 0;font-size:14.5px;color:var(--ink-soft)}
.todo{margin:0;padding-inline-start:22px}
.todo li{padding:8px 0;border-bottom:1px solid var(--line)}
.todo li:last-child{border-bottom:0}
.todo li span{display:block;margin-bottom:4px}
.todo a{text-decoration:none}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr);padding:0 12px;gap:12px}
  .side{position:sticky;top:0;z-index:25;display:flex;gap:4px;overflow-x:auto;max-height:none;border-radius:0 0 14px 14px;border-top:0;padding:8px;margin-inline:-12px}
  .side .sg{display:none}
  .side button{flex:none;width:auto;padding:7px 12px;font-size:13.5px;white-space:nowrap}
  .side .ic{width:26px;height:26px}
  .acc-grid{grid-template-columns:minmax(0,1fr)}
  .vp{padding:26px 16px 20px}
  .vp-sum{padding-inline-start:0}
}
@media print{.side,.topbar{display:none!important}.app{display:block}.tabpane{display:none!important}.tabpane.on{display:block!important}.vp{display:none}}
.side .bd:empty{display:none}
.vp-cl h4 .ht{flex:1;font-style:normal}
.vp-head{text-align:center;padding-top:18px}
.vp-code{text-align:center}
.vp-stamp{top:12px;inset-inline-start:14px;inset-inline-end:auto}
a.tk-btn{text-decoration:none}


/* ---- recommendations, risks & opportunities ---- */
.rx-prof{grid-column:1/-1;display:grid;grid-template-columns:minmax(200px,280px) 1fr;gap:12px;align-items:start}
.rx-prof .rx-chipf:last-child{grid-column:1/-1}
.rx-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.pchip{border:1.5px solid var(--line);background:#fff;color:var(--ink-soft);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
.pchip:hover{border-color:var(--ink-soft)}
.pchip[aria-pressed="true"]{background:var(--plan);border-color:var(--plan);color:#fff}
.rx-sec{margin-top:26px}
.rx-note{background:var(--gold-tint);border-inline-start:4px solid var(--gold);padding:10px 14px;border-radius:var(--radius-sm);color:#5E4A12;margin:10px 0 0;font-size:14.5px}
.rx-ims{margin-top:12px;background:linear-gradient(135deg,#1B2A4A,#27395f);color:#fff;border-radius:var(--radius-lg);padding:18px 20px;display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center}
.rx-ims b{font-family:var(--display);font-size:16.5px}
.rx-ims p{margin:6px 0 0;color:#DCE4EE;font-size:14.5px}
.rx-held{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:flex-end}
.rx-held span{font-size:12.5px;color:#E6CF8A;width:100%;text-align:end}
.rx-held em,.rx-lane em,.rx-gline em{font-style:normal;font-family:Georgia,serif;font-weight:700;font-size:13px;padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.14)}
.rx-road{margin-top:14px;background:#fff;border:1px solid var(--line);border-radius:var(--radius-lg);padding:16px 18px}
.rx-road h4,.rx-gh{font-family:var(--display);font-size:16.5px;margin:0 0 10px}

<style id="dmaic-css">/* ===== DMAIC tool — additions to the PDCA host styles, CAPA's, 5 Whys', Fishbone's, Pareto's, RCA's and A3's additions (same tokens) ===== */

.ex-seg:hover,.ex-seg:focus-visible{filter:drop-shadow(0 6px 12px rgba(27,42,74,.2))}
.ex-seg:focus{outline:none}
.ex-seg:focus-visible .ex-shape{stroke:var(--ex-gold,#B8901E);stroke-width:4}
.ex-legend{display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:center;padding:6px 0 2px;font-size:13.5px;color:var(--ex-soft)}
.ex-legend span{display:inline-flex;align-items:center;gap:6px}
.ex-legend i{width:12px;height:12px;border-radius:4px;display:inline-block}
.ex-idx-h{font-size:13px;font-weight:700;color:var(--ex-mut);margin:16px 4px 6px}
.ex-idx{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:8px}
.ex-idx button{all:unset;box-sizing:border-box;cursor:pointer;background:var(--ex-bg);border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:center;border:1px solid transparent;min-width:0}
.ex-idx button:hover{background:#fff;border-color:var(--ex-line)}
.ex-idx button:focus-visible{outline:3px solid var(--ex-gold)}
.ex-idx .n{font-family:Georgia,serif;font-weight:700;font-size:20px;line-height:1;min-width:38px;text-align:center;direction:ltr}
.ex-idx .n.lg{font-size:15px;white-space:nowrap}
.ex-idx .t{font-size:13.5px;font-weight:600;line-height:1.4;min-width:0}
.ex-idx .t small{display:block;color:var(--ex-mut);font-weight:500;font-size:12px}
.ex-flags{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:14px 4px 0;font-size:13.5px;color:var(--ex-soft)}
.ex-flags button{border:1px solid var(--fc,#C2410C);background:var(--ft,#FDECE3);color:var(--fc,#C2410C);border-radius:999px;padding:3px 10px;font:inherit;font-size:12.5px;font-weight:700;cursor:pointer;direction:ltr}
.ex-search{margin-top:16px;position:relative}
.ex-search input{width:100%;font:inherit;font-size:15.5px;padding:13px 16px;padding-inline-start:46px;border-radius:var(--ex-r);border:1.5px solid var(--ex-line);background:#fff;color:var(--ex-ink)}
.ex-search input:focus{outline:none;border-color:#1E8C93;box-shadow:0 0 0 4px #E3F4F4}
.ex-search>svg{position:absolute;inset-inline-start:15px;top:24px;transform:translateY(-50%);color:var(--ex-mut)}
.ex-res{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:6px}
.ex-res button{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:12px;align-items:baseline;width:100%;padding:9px 13px;border-radius:9px;background:#fff;border:1px solid var(--ex-line)}
.ex-res button:hover,.ex-res button:focus-visible{border-color:#1E8C93}
.ex-res .rn{font-family:Georgia,serif;font-weight:700;color:#1E8C93;direction:ltr;min-width:62px}
.ex-res .rt{font-weight:600}
.ex-res .rs{color:var(--ex-mut);font-size:13px}
.ex-res .empty{padding:9px 13px;color:var(--ex-soft);background:#fff;border-radius:9px}
.ex-paths{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:12px}
.ex-path{background:#fff;border:1px solid var(--ex-line);border-inline-start:5px solid var(--tc);border-radius:var(--ex-rl);padding:15px 17px}
.ex-path h4{margin:0 0 3px;font-family:var(--display);font-size:16px;color:var(--tc)}
.ex-path p{margin:0 0 10px;color:var(--ex-soft);font-size:13.5px;line-height:1.6}
.ex-chain{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.ex-chain button{border:1px solid var(--ex-line);background:var(--ex-bg);border-radius:10px;padding:5px 8px;cursor:pointer;font:inherit;display:grid;text-align:center;max-width:128px;min-width:0}
.ex-chain button:hover,.ex-chain button:focus-visible{border-color:var(--tc);background:#fff}
.ex-chain b{font-family:Georgia,serif;color:var(--tc);font-size:13.5px;direction:ltr}
.ex-chain small{font-size:11px;color:var(--ex-soft);line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ex-chain .ar{color:var(--ex-mut);font-weight:700}
.ex-mx{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:14px}
.ex-mx p{margin:0;color:var(--ex-soft);font-size:14px;max-width:70ch}

/* drawer */
.ex-scrim{position:fixed;inset:0;background:rgba(27,42,74,.34);opacity:0;pointer-events:none;transition:opacity .25s;z-index:58}
.ex-scrim.on{opacity:1;pointer-events:auto}
.ex-drawer{position:fixed;top:0;bottom:0;inset-inline-start:0;width:min(820px,100%);background:var(--bg,#F3F7FB);z-index:60;transform:translateX(-104%);transition:transform .32s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;box-shadow:0 0 40px rgba(27,42,74,.22);visibility:hidden}
html[dir="rtl"] .ex-drawer{transform:translateX(104%)}
.ex-drawer.on,html[dir="rtl"] .ex-drawer.on{transform:none;visibility:visible}
.ex-d-head{padding:18px 22px 16px;padding-inline-start:72px;color:#fff;position:relative;flex:none}
.ex-d-row{display:flex;gap:14px;align-items:center;min-width:0;padding-inline-end:110px}
.ex-d-num{font-family:Georgia,serif;font-weight:700;font-size:34px;line-height:1;direction:ltr;flex:none}
.ex-d-ph{display:inline-block;font-size:12px;font-weight:700;background:rgba(255,255,255,.18);border-radius:999px;padding:2px 10px;margin-bottom:4px}
.ex-d-title{margin:0;font-family:var(--display);font-size:clamp(17px,2.4vw,22px);line-height:1.4}
.ex-d-tools-top{position:absolute;top:14px;inset-inline-end:14px;display:flex;gap:6px}
.ex-d-tools-top button{border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:#fff;border-radius:999px;height:36px;min-width:36px;padding:0 10px;font:inherit;font-size:12.5px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:5px}
.ex-d-tools-top button:hover{background:rgba(255,255,255,.24)}
.ex-d-body{flex:1;overflow:auto;padding:18px 22px 24px;overscroll-behavior:contain}
.ex-d-foot{flex:none;display:flex;justify-content:space-between;gap:10px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--surface,#fff);border-top:1px solid var(--line,#DCE4EE)}
.ex-d-foot button{border:1px solid var(--line,#DCE4EE);background:#fff;color:var(--ink,#1B2A4A);border-radius:999px;padding:8px 14px;font:inherit;font-size:13.5px;font-weight:600;cursor:pointer;max-width:48%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ex-d-foot button:disabled{opacity:.4;cursor:default}
.ex-d-intro{margin:0 0 12px;font-size:15.5px;line-height:1.8;color:var(--ink-soft,#4B5874)}
.ex-flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 14px}
.ex-flow span{background:#fff;border:1px solid var(--line,#DCE4EE);border-radius:999px;padding:4px 11px;font-size:13px;font-weight:600}
.ex-flow i{font-style:normal;color:var(--muted,#7A869E);font-weight:700}
.ex-d-tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 12px}
.ex-d-tools .ex-cnt{margin-inline-start:auto;font-size:12.5px;color:var(--muted,#7A869E);font-weight:600}
.ex-it{background:#fff;border:1px solid var(--line,#DCE4EE);border-radius:14px;margin-bottom:9px;overflow:hidden}
.ex-it.hit{box-shadow:0 0 0 3px var(--gold,#B8901E)}
.ex-it-h{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:10px;align-items:center;width:100%;padding:12px 14px}
.ex-it-h:focus-visible{outline:3px solid var(--gold,#B8901E);outline-offset:-3px}
.ex-it-c{font-family:Georgia,serif;font-weight:700;font-size:13px;border-radius:8px;padding:3px 8px;direction:ltr;white-space:nowrap;flex:none}
.ex-it-t{flex:1;font-weight:700;font-size:15px;line-height:1.45;min-width:0}
.ex-badge{font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap;flex:none}
.ex-chev{flex:none;transition:transform .2s;color:var(--muted,#7A869E)}
.ex-it.open .ex-chev{transform:rotate(180deg)}
.ex-it-b{display:none;padding:0 14px 14px}
.ex-it.open .ex-it-b{display:block}
.ex-pns{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.ex-pn{border-radius:12px;padding:12px 14px;min-width:0}
.ex-pn h5{margin:0 0 6px;font-size:13.5px;font-family:var(--display);display:flex;gap:7px;align-items:center}
.ex-pn p{margin:0;font-size:14.5px;line-height:1.75}
.ex-pn.req{grid-column:1/-1;background:var(--bg,#F3F7FB)}
.ex-pn.ex{background:#E5F4EA}.ex-pn.ex h5{color:#2F7D4B}
.ex-pn.how{background:#E7EEFB}.ex-pn.how h5{color:#3563C9}
.ex-pn.ev{background:#FCF1DE}.ex-pn.ev h5{color:#9A6210}
.ex-pn.gap{background:#FDECE3}.ex-pn.gap h5{color:#C2410C}
.ex-pn.lk{grid-column:1/-1;background:#F4F0FB}.ex-pn.lk h5{color:#5B3F95}
.ex-pn ol{margin:0;padding:0;list-style:none;counter-reset:s}
.ex-pn ol li{counter-increment:s;position:relative;padding-inline-start:30px;margin-bottom:5px;font-size:14px;line-height:1.6}
.ex-pn ol li::before{content:counter(s);position:absolute;inset-inline-start:0;top:2px;width:21px;height:21px;border-radius:50%;background:#3563C9;color:#fff;font-size:11.5px;font-weight:700;display:grid;place-items:center}
.ex-pn ul{margin:0;padding-inline-start:18px}
.ex-pn ul li{font-size:14px;line-height:1.6;margin-bottom:4px}
.ex-evs{display:flex;flex-wrap:wrap;gap:6px}
.ex-evs span{background:#fff;border:1px solid #F0DDB8;border-radius:9px;padding:4px 9px;font-size:13px;line-height:1.5}
.ex-lks{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.ex-lks li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px;align-items:start}
.ex-lks .d{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;grid-row:span 2;margin-top:2px}
.ex-lks .d.in{background:#E7EEFB;color:#3563C9}
.ex-lks .d.out{background:#E5F4EA;color:#2F7D4B}
.ex-lks button{border:0;background:none;padding:0;font:inherit;font-weight:700;font-size:14px;color:var(--ink,#1B2A4A);cursor:pointer;text-align:start}
.ex-lks button b{font-family:Georgia,serif;color:var(--lc,#5B3F95);margin-inline-end:5px;direction:ltr;unicode-bidi:isolate}
.ex-lks button:hover{text-decoration:underline}
.ex-lks small{grid-column:2;color:var(--ink-soft,#4B5874);font-size:13px;line-height:1.5}
.ex-meta2{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:13px;color:var(--ink-soft,#4B5874)}
.ex-meta2 b{color:var(--ink,#1B2A4A)}
.ex-it-act{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.ex-lock{overflow:hidden}

/* links inside the assessment */
.ex-qx{flex:none;border:1px solid var(--line,#DCE4EE);background:#fff;color:var(--ink-soft,#4B5874);border-radius:999px;padding:3px 10px;font:inherit;font-size:12.5px;font-weight:700;cursor:pointer;display:inline-flex;gap:5px;align-items:center;white-space:nowrap;margin-top:2px}
.ex-qx:hover,.ex-qx:focus-visible{border-color:var(--gold,#B8901E);color:var(--ink,#1B2A4A)}
.ex-hl{outline:3px solid var(--gold,#B8901E)!important;outline-offset:4px;animation:exPulse 1.2s ease-in-out 2}
@keyframes exPulse{50%{outline-color:rgba(184,144,30,.25)}}

/* v1.1 — role filter */
.ex-rolebox{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:2px 6px 10px}
.ex-rolef{display:inline-flex;flex-wrap:wrap;align-items:center;gap:3px;background:var(--bg,#F3F7FB);border:1px solid var(--line,#DCE4EE);border-radius:999px;padding:4px}
.ex-rolef-l{font-size:12.5px;font-weight:700;color:var(--muted,#7A869E);padding:0 8px 0 6px}
.ex-rolef button{border:0;background:transparent;color:var(--ink,#1B2A4A);border-radius:999px;padding:6px 14px;font:inherit;font-size:13.5px;font-weight:700;cursor:pointer;white-space:nowrap;line-height:1.3}
.ex-rolef button:hover{background:#fff}
.ex-rolef button[aria-checked="true"]{background:var(--rc,#1B2A4A);color:#fff}
.ex-rolef button:focus-visible{outline:3px solid var(--gold,#B8901E);outline-offset:1px}
.ex-rolef.sm{padding:3px}.ex-rolef.sm button{padding:4px 11px;font-size:12.5px}
.ex-rolef-d{margin:0;font-size:13.5px;color:var(--ink-soft,#4B5874);line-height:1.55;flex:1 1 240px}
.ex-off{opacity:.36}
.ex-seg.ex-off{filter:grayscale(.75)}
.ex-seg.ex-off:hover,.ex-seg.ex-off:focus-visible{opacity:.75}
.ex-offnote{margin:0 0 12px;padding:10px 14px;border-radius:10px;background:#FFF7E6;border:1px dashed #E0B44C;color:#6E4C0E;font-size:14px;line-height:1.65}
.ex-d-role{margin:0 0 12px}
/* v1.1 — reference chips, role notes, matching controls */
.ex-refs{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-top:10px;font-size:12.5px;color:var(--ink-soft,#4B5874)}
.ex-refs>span:first-child{font-weight:700;color:var(--ink,#1B2A4A);margin-inline-end:2px}
.ex-ref{background:#fff;border:1px solid var(--line,#DCE4EE);border-radius:999px;padding:2px 9px;font-weight:600}
.ex-pn.rn{grid-column:1/-1;background:#EEF3F8}.ex-pn.rn h5{color:var(--ink,#1B2A4A)}
.ex-rn{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:8px}
.ex-rn>div{background:#fff;border-radius:10px;border-inline-start:4px solid var(--rc);padding:9px 12px}
.ex-rn b{display:block;font-size:13px;color:var(--rc);margin-bottom:2px}
.ex-rn p{font-size:14px}
.ex-cp{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:9px;font-size:13px}
.ex-cp>span{font-weight:700;color:var(--ink-soft,#4B5874)}
.ex-cp button{border:1px solid var(--line,#DCE4EE);background:#fff;border-radius:9px;padding:4px 10px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;text-align:start;color:var(--ink,#1B2A4A)}
.ex-cp button b{font-family:Georgia,serif;color:var(--lc,#5B3F95);direction:ltr;unicode-bidi:isolate}
.ex-cp button:hover,.ex-cp button:focus-visible{border-color:var(--lc,#5B3F95)}
.ex-act-off{font-size:13px;color:var(--ink-soft,#4B5874);background:var(--bg,#F3F7FB);border-radius:9px;padding:7px 11px;line-height:1.55;flex:1 1 260px}
/* v1.1 — what's new tab */
.ex-tl{list-style:none;margin:6px 0 0;padding:0;display:grid;grid-template-columns:repeat(var(--n,4),minmax(0,1fr));row-gap:18px}
@media (max-width:1100px) and (min-width:761px){.ex-tl{grid-template-columns:repeat(3,minmax(0,1fr))}}
.ex-tl li{position:relative;padding:26px 14px 6px 0;border-top:3px solid var(--ex-line)}
.ex-tl li::before{content:"";position:absolute;top:-10px;inset-inline-start:0;width:17px;height:17px;border-radius:50%;background:#fff;border:3px solid var(--ex-line);box-sizing:border-box}
.ex-tl li.done{border-top-color:var(--tc)}
.ex-tl li.done::before{background:var(--tc);border-color:var(--tc)}
.ex-tl li.next::before{border-color:var(--tc);box-shadow:0 0 0 5px var(--ex-gt)}
.ex-tl-d{display:block;font-weight:700;font-size:13px;color:var(--tc)}
.ex-tl b{display:block;font-size:14.5px;margin:3px 0 2px;line-height:1.45}
.ex-tl small{display:block;color:var(--ex-soft);font-size:13px;line-height:1.55}
.ex-tl em{display:inline-block;margin-top:7px;font-style:normal;font-size:11.5px;font-weight:700;background:var(--ex-gt);color:#6E4C0E;border-radius:999px;padding:2px 9px}
.ex-chg{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));gap:14px}
.ex-chg-c{background:var(--ex-sf);border:1px solid var(--ex-line);border-top:4px solid var(--tc);border-radius:var(--ex-rl);padding:16px 18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.ex-chg-c header{display:flex;gap:12px;align-items:flex-start}
.ex-chg-n{font-family:Georgia,serif;font-weight:700;font-size:26px;line-height:1;color:var(--tc);min-width:22px;text-align:center}
.ex-chg-tag{display:block;font-size:12.5px;font-weight:700;color:var(--tc)}
.ex-chg-c h4{margin:2px 0 0;font-family:var(--display);font-size:16.5px;line-height:1.45}
.ex-chg-b{display:grid;gap:8px}
.ex-chg-b>div{border-radius:11px;padding:9px 12px}
.ex-chg-b .ex-cw{background:var(--ex-bg)}
.ex-chg-b .ex-cy{background:#FCF1DE}
.ex-chg-b .ex-cd{background:#E5F4EA}
.ex-chg-b h5{margin:0 0 3px;font-size:12.5px;font-family:var(--display);color:var(--ex-ink)}
.ex-chg-b .ex-cy h5{color:#9A6210}.ex-chg-b .ex-cd h5{color:#2F7D4B}
.ex-chg-b p{margin:0;font-size:14px;line-height:1.75}
.ex-chg-b ul{margin:0;padding-inline-start:18px}
.ex-chg-b li{font-size:14px;line-height:1.6;margin-bottom:3px}
.ex-chg-c footer{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border-top:1px dashed var(--ex-line);padding-top:10px;margin-top:auto}
.ex-chg-c footer>span{font-size:12.5px;font-weight:700;color:var(--ex-mut)}
.ex-chg-c footer button{border:1px solid var(--ex-line);background:var(--ex-bg);border-radius:9px;padding:4px 9px;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;text-align:start;color:var(--ex-ink);max-width:100%}
.ex-chg-c footer button b{font-family:Georgia,serif;color:var(--tc);direction:ltr;unicode-bidi:isolate}
.ex-chg-c footer button.go{background:#fff;border-color:var(--tc);color:var(--tc)}
.ex-chg-c footer button:hover,.ex-chg-c footer button:focus-visible{border-color:var(--tc);background:#fff}
.ex-corr-w{overflow-x:auto;border:1px solid var(--ex-line);border-radius:var(--ex-r);background:var(--ex-sf)}
.ex-corr-w:focus-visible{outline:3px solid var(--ex-gold)}
.ex-corr{width:100%;border-collapse:collapse;font-size:14px;min-width:620px}
.ex-corr th{background:var(--ex-ink);color:#fff;text-align:start;padding:9px 12px;font-size:13px}
.ex-corr td{padding:9px 12px;border-top:1px solid var(--ex-line);vertical-align:top;line-height:1.6}
.ex-corr td:first-child{color:var(--ex-mut);font-weight:600}
.ex-corr td:nth-child(2){font-weight:700}
.ex-steps{margin:0;padding:0;list-style:none;counter-reset:st;display:grid;gap:7px;max-width:86ch}
.ex-steps li{counter-increment:st;position:relative;padding:9px 14px;padding-inline-start:48px;background:var(--ex-sf);border:1px solid var(--ex-line);border-radius:12px;font-size:14.5px;line-height:1.65}
.ex-steps li::before{content:counter(st);position:absolute;inset-inline-start:12px;top:9px;width:24px;height:24px;border-radius:50%;background:var(--ex-ink);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center}

/* v1.2 — context next to "Assess this", Explain links inside host headings */
.ex-act-ctx{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--ink-soft,#4B5874);background:var(--bg,#F3F7FB);border:1px dashed var(--line,#DCE4EE);border-radius:999px;padding:5px 12px;max-width:100%;overflow-wrap:anywhere}
:is(h2,h3,h4)>.ex-qx{font-family:var(--body);font-weight:700;font-size:12.5px;line-height:1.4;vertical-align:middle;margin-inline-start:10px;margin-top:0}

@media (max-width:760px){
 .ex-meta{grid-template-columns:1fr}
 .ex-pns{grid-template-columns:1fr}
 .ex-smap li{grid-template-columns:44px minmax(0,1fr);padding:10px 12px}
 .ex-smap li .ex-btn{grid-column:2;justify-self:start}
 .ex-d-head{padding:14px 14px 12px;padding-inline-start:66px}
 .ex-d-row{padding-inline-end:0;margin-top:40px}
 .ex-d-body{padding:14px 14px 20px}
 .ex-facts div{grid-template-columns:96px minmax(0,1fr)}
 .ex-tl{grid-template-columns:1fr}
 .ex-tl li{border-top:0;border-inline-start:3px solid var(--ex-line);padding:2px 0 16px;padding-inline-start:20px}

      "ar": "ملخص تفسيري، وليس النص الرسمي: يراجع ISO 10009:2024 منهج FMEA في البند 7.3 منهجيةً قائمة على المخاطر لتحديد المشكلات المحتملة وتحليلها وترتيبها أثناء تطوير المنتج أو العملية، ثم أثناء الإنتاج أو تقديم الخدمة. ومن أنواعها: التصميم، والعملية، ومراجعة التصميم المبنية على نمط الفشل، والعِدد، والبرمجيات، وتصميم الخدمة وتقديمها، وأنظمة الرصد. وهي نشاط فريق يمثل الوظائف المعنية وقد يضم العميل، وتحتاج تحضيراً ومخططات تدفق وميسراً كفؤاً ووقتاً، وتتناول أنماط الفشل المنفردة لا المركبة. والمواصفة إرشادات، وFMEA ليس متطلباً في أي مواصفة.",

      "en": "Practical guidance from the author's experience, not normative text: common gaps: a study filled in by one person, scales written after the rating, compound modes, an effect that does not name the customer, \"human error\" as a cause, one control counted as both prevention and detection, work ranked by the priority number alone, severity lowered by a check, actions with no owner, new ratings with no evidence, and a study never opened since it was written. An auditor usually asks for: the team and the facilitator, the agreed scales with their date, the structure, the analysis table, the high-severity rows and their actions, the re-rating with evidence, the last review after a change or a nonconformity, and the link to the control plan. The tool checks this automatically in the Audit tab."

 homeLede:"A structured, team-based look ahead: how each process step (or design function) can fail, what the effect would be on the customer or the next step, what could cause it, and which controls prevent or detect it — before the failure happens, or right after a new one is found. Scales written before the rating, high severity first whatever the priority number, actions with an owner and a date, then a new rating with evidence.",

 foot:"Sources: ISO 10009:2024 subclauses 7.3, 6.3, 7.1, 7.2 and 7.5, Annex A (Table A.3) and Table C.1; ISO 9001:2026 introduction 0.3.2, clauses 6.1, 8.1, 8.3.4, 8.5.1, 8.5.6, 9.1.3, 10.1 and 10.2 and Annex A.6.1; ISO 9000:2026 principles (interpretive summaries, not the official text). FMEA is a method, not a requirement of any standard. Examples are illustrative, not real data.",

 termT:"Is FMEA a requirement of ISO 9001:2026?",
 termP1:"No. FMEA is a method, not a requirement of any standard. ISO 10009:2024 (guidance for quality tools) reviews it in subclause 7.3 as a risk-based method to identify, analyse and rank potential problems, and names it as an input to the control plan (6.3). ISO 9001:2026 asks the organization to determine, analyse and evaluate risks and to plan actions to address them (6.1.2) without imposing a method; Annex A.6.1.2 explains that risk-based thinking does not imply formal risk management.",
 termP2:"In practice: the severity, occurrence and detection scales are written before the rating and kept the same across the study. Severity is rated on the effect and is not lowered by a control, only by a design or process change. The risk priority number (severity × occurrence × detection) hides big severities, so it is not a ranking to act on by itself: high severity is treated first whatever the number. Ratings come from data and the team, not from one person. \"Human error\" is a cause to design out (8.5.1 g)), not a failure mode to blame. The study is a living document, reviewed when the process changes, after a nonconformity and after an audit finding.",
 termP3:"FMEA uses the toolbox rather than replacing it: the structured what-if technique first when the process is large (ISO 10009 subclause 7.1), Pareto and RCA for the failures already seen, Fishbone and 5 Whys for the causes, DMAIC and A3 for the actions that need a project, CAPA when a nonconformity is involved, and PDCA for the follow-up.",
 termIs:"Interpretive summary in independent wording, not the official text. Sources: ISO 10009:2024 subclauses 7.3, 6.3, 7.1 and Table C.1; ISO 9001:2026 clauses 6.1.2, 8.5.1 g), 8.5.6, 10.2.1 and Annex A.6.1.2. Any reference to IEC 60812, the AIAG-VDA FMEA handbook, ISO 31000 or ISO 31010 is not uploaded: \"not verified\". Checked: 2026-10-16.",
 defs:[["Failure mode","FMEA · ISO 10009 7.3","The way a step or function could fail to do what is expected of it. A single mode, not a compound one.","#B42318"],["Effect and severity","S · 1–10","What the customer or the next step sees if the failure happens. Severity is rated on the effect and is not lowered by controls.","#C2410C"],["Cause and occurrence","O · 1–10","What could lead to the failure mode, and how often it happens with the current prevention controls.","#3563C9"],["Detection","D · 1–10","How well the current detection controls find the cause or the mode before it reaches the customer.","#1E8C93"],["Action priority","H · M · L","A written rule: severity 9 or 10 is always high, then severity × occurrence, then detection. The priority number is shown only.","#1B2A4A"]],

function personOnly(s){ return PERSON.test(String(s||"")); }

/* ---------- simple statistics: they serve the decision; nothing here needs more than a mean, a median and a rate ---------- */
function ptVal(p,kind){ if(kind==="rate") return (p.n!==null&&p.n>0&&p.d!==null&&p.d>=0&&p.d<=p.n)?p.d/p.n*100:null; return p.v; }
function series(list,kind){ return list.filter(function(p){ return txt(p.l)&&ptVal(p,kind)!==null; }).map(function(p){ return {l:p.l,v:ptVal(p,kind),d:p.d,n:p.n}; }); }
function meanOf(a){ return a.length?a.reduce(function(x,y){ return x+y; },0)/a.length:null; }
function medianOf(a){ var s=a.slice().sort(function(x,y){ return x-y; }), n=s.length; return n?(n%2?s[(n-1)/2]:(s[n/2-1]+s[n/2])/2):null; }
function sdOf(a){ if(a.length<2) return null; var m=meanOf(a); return Math.sqrt(a.reduce(function(s,x){ return s+(x-m)*(x-m); },0)/(a.length-1)); }
function statsOf(list,kind,lsl,usl){
 var S=series(list,kind), V=S.map(function(x){ return x.v; }), o={n:S.length,S:S,mean:meanOf(V),median:medianOf(V),sd:sdOf(V),rate:null,dpmo:null,out:null,cpk:null,defects:0,units:0};
 if(kind==="rate"){ S.forEach(function(x){ o.defects+=x.d; o.units+=x.n; }); if(o.units>0){ o.rate=o.defects/o.units*100; o.dpmo=Math.round(o.defects/o.units*1e6); } }
 else { if(S.length&&(lsl!==null||usl!==null)){ var k=V.filter(function(v){ return (lsl!==null&&v<lsl)||(usl!==null&&v>usl); }).length; o.out=k/V.length*100; o.rate=o.out; }
  if(o.sd&&o.sd>0&&S.length>=10&&(lsl!==null||usl!==null)){ var c=[]; if(usl!==null) c.push((usl-o.mean)/(3*o.sd)); if(lsl!==null) c.push((o.mean-lsl)/(3*o.sd)); o.cpk=Math.min.apply(null,c); } }
 return o;
}
function keyStat(o,stat){ return stat==="mean"?o.mean:(stat==="median"?o.median:o.rate); }
function baseStats(r){ return statsOf(r.meas.pts,r.meas.kind,r.meas.lsl,r.meas.usl); }
function afterStats(r){ return statsOf(r.ctl.pts,r.meas.kind,r.meas.lsl,r.meas.usl); }
function baseKey(r){ var b=baseStats(r); if(b.n) return keyStat(b,r.meas.stat); var I=paBase(r); return I?I.x.v:null; }
function afterKey(r){ var a=afterStats(r); return a.n>=MINPTS?keyStat(a,r.meas.stat):null; }
function paBase(r){ if(!txt(r.meas.pareto)) return null; return paCatInfo(r.meas.pareto,r.pcat)||(function(){ var p=byIdIn(PARETO_KEY,r.meas.pareto); if(!p) return null; var K=paRank(p); return {p:p,x:{v:K.total,c:{name:str(p.title),id:""},share:100,vit:false},txt:str(p.title)}; })(); }
/* result against the goal: met when the value reaches the target, partly when it moved from the start towards it */
function cmpGoal(r,v){ var g=r.goal; if(g.from===null||g.to===null||g.from===g.to||v===null||v===undefined) return "";
 var down=g.to<g.from; if(down?v<=g.to:v>=g.to) return "met"; if(down?v<g.from:v>g.from) return "part"; return "not"; }
function suggest(r){ return cmpGoal(r,afterKey(r)); }
/* run chart reading after the change: points on the better side of the baseline median and the longest run there */
function runRead(r){ var A=afterStats(r).S, bm=baseStats(r).median, g=r.goal; if(!A.length||bm===null||g.from===null||g.to===null||g.from===g.to) return null;
 var down=g.to<g.from, b=0, k=0, run=0; A.forEach(function(x){ var ok=down?x.v<bm:x.v>bm; if(ok){ b++; run++; k=Math.max(k,run); } else run=0; }); return {b:b,n:A.length,k:k,m:bm}; }

/* ---------- two-group data check of a cause (rates or means) or a linked analysis ---------- */
function chkRes(c){ var k=c.chk, o={ok:false,kind:k.kind,z:null};
 if(k.kind==="rate"){ if(txt(k.ga)&&txt(k.gb)&&k.na>0&&k.nb>0&&k.xa!==null&&k.xb!==null&&k.xa>=0&&k.xb>=0&&k.xa<=k.na&&k.xb<=k.nb){
   o.ok=true; o.a=k.xa/k.na*100; o.b=k.xb/k.nb*100; o.d=o.a-o.b; var p=(k.xa+k.xb)/(k.na+k.nb), se=Math.sqrt(p*(1-p)*(1/k.na+1/k.nb)); o.z=se>0?(k.xa/k.na-k.xb/k.nb)/se:null; } }
 else if(k.kind==="mean"){ if(txt(k.ga)&&txt(k.gb)&&k.na>=2&&k.nb>=2&&k.xa!==null&&k.xb!==null){
   o.ok=true; o.a=k.xa; o.b=k.xb; o.d=k.xa-k.xb; if(k.sa!==null&&k.sb!==null&&(k.sa>0||k.sb>0)){ var s2=Math.sqrt(k.sa*k.sa/k.na+k.sb*k.sb/k.nb); o.z=s2>0?o.d/s2:null; } } }
 else if(k.kind==="link"){ o.ok=["fish","why5","rca"].indexOf(c.how)>=0&&!!txt(c.ref); }
 return o; }
function chkText(c){ var o=chkRes(c), k=c.chk; if(!k.kind) return "";
 if(k.kind==="link") return o.ok?t("ckLink",{id:c.ref}):t("ckLinkMiss");
 if(!o.ok) return t("ckInc");
 var s=k.kind==="rate"?t("ckRate",{a:fmt1(o.a),b:fmt1(o.b),d:fmt1(o.d)}):t("ckMean",{a:fmtN(o.a),b:fmtN(o.b),d:fmtN(Math.round(o.d*100)/100)});
 if(o.z!==null) s+=t("ckZ",{z:fmtN(Math.round(o.z*100)/100)})+" — "+(Math.abs(o.z)>=2?t("ckStrong"):(c.st==="out"?t("ckOut"):t("ckWeak"))); else if(k.kind==="mean"&&c.st!=="out") s+=" — "+t("ckNoZ");
 if(c.st==="out"&&!(o.z!==null&&Math.abs(o.z)<2)) s+=" "+t("ckOut");
 return s; }

/* ---------- the project's rules ---------- */
var PERSON=/(خطأ\s*(بشري|العامل|الموظف|الفني|المشغل|السائق|الشخص|الرافع|المشرف)|إهمال|اهمال|تقصير|عدم\s*(انتباه|الانتباه|تركيز|التركيز)|سهو|لامبالاة|human\s*error|operator\s*error|worker\s*error|staff\s*error|employee\s*error|rigger\s*error|driver\s*error|negligen|careless|inattent|not\s*paying\s*attention|lack\s*of\s*attention|complacen)/i;
function personOnly(s){ return PERSON.test(String(s||"")); }
function leadOk(r){ return !!txt(r.lead)&&!!txt(r.sponsor)&&low(r.sponsor)!==low(r.lead); }
function spLead(r){ return !!txt(r.lead)&&low(r.sponsor)===low(r.lead); }
function ctqs(r){ return r.def.ctq.filter(function(x){ return txt(x.t); }); }
function steps(r){ return r.def.sip.steps.filter(function(x){ return txt(x.t); }); }
function probOk(r){ return !!(txt(r.def.problem)&&txt(r.def.cost)&&ctqs(r).length); }
function sipOk(r){ var s=r.def.sip, n=steps(r).length; return !!(txt(s.s)&&txt(s.i)&&txt(s.o)&&txt(s.c))&&n>=5&&n<=MAXSTEPS; }
function scopeOk(r){ return !!(txt(r.def.scin)&&txt(r.def.scout))&&sipOk(r); }
function goalNum(r){ var g=r.goal; return !!(txt(g.measure)&&g.from!==null&&g.to!==null&&g.from!==g.to&&isD(g.by)&&isD(g.date)); }
function changed(r){ return r.goal.orig!==null&&r.goal.to!==null&&r.goal.orig!==r.goal.to; }
/* the goal is written in Define, before the analysis: its date is not after the date the analysis started */
function late(r){ return isD(r.goal.date)&&isD(r.an.date)&&r.goal.date>r.an.date; }
function goalBefore(r){ return isD(r.goal.date)&&(live(r).length?(isD(r.an.date)&&!late(r)):!late(r)); }
function goalOk(r){ return goalNum(r)&&goalBefore(r)&&!(changed(r)&&!txt(r.goal.why)); }
function defOk(r){ return leadOk(r)&&probOk(r)&&scopeOk(r)&&goalOk(r); }
function opdefOk(r){ var m=r.meas; return !!(txt(m.what)&&txt(m.unit)&&txt(m.source)&&txt(m.sample)); }
function msaDone(r){ var s=r.meas.msa; return !!(s.method&&txt(s.res)&&txt(s.rule)&&s.verdict&&isD(s.date)); }
function msaTrust(r){ return msaDone(r)&&(r.meas.msa.verdict==="pass"||r.meas.msa.verdict==="part"); }
function msaLate(r){ return isD(r.meas.msa.date)&&isD(r.meas.date)&&r.meas.msa.date>r.meas.date; }
function msaOk(r){ return opdefOk(r)&&msaTrust(r)&&isD(r.meas.date)&&!msaLate(r); }
function baseData(r){ return baseStats(r).n>=MINPTS||!!txt(r.meas.pareto); }
function baseOk(r){ return !!txt(r.meas.period)&&isD(r.meas.date)&&baseData(r); }
function measOk(r){ return msaOk(r)&&baseOk(r); }
function live(r){ return r.an.causes.filter(function(c){ return txt(c.t)&&c.st!=="out"; }); }
function proved(r){ return live(r).filter(function(c){ return c.st==="conf"&&chkRes(c).ok; }); }
function hyps(r){ return live(r).filter(function(c){ return c.st!=="conf"; }); }
function unchk(r){ return live(r).filter(function(c){ return c.st==="conf"&&!chkRes(c).ok; }); }
function personCauses(r){ return live(r).filter(function(c){ return personOnly(c.t); }); }
function anOk(r){ return isD(r.an.date)&&proved(r).length>0&&!personCauses(r).length; }
function sols(r){ return r.imp.sols.filter(function(s){ return txt(s.t); }); }
function provedIds(r){ var o={}; proved(r).forEach(function(c){ o[c.id]=1; }); return o; }
function untied(r){ var P=provedIds(r); return sols(r).filter(function(s){ return !P[s.cause]; }); }
function piloted(s){ return isD(s.from)&&isD(s.to)&&s.from<=s.to&&s.val!==null&&!!txt(s.where); }
function unpiloted(r){ return sols(r).filter(function(s){ return !piloted(s); }); }
function unrisk(r){ return sols(r).filter(function(s){ return !txt(s.risk)||!txt(s.ctrl); }); }
function untreated(r){ var S=sols(r); return proved(r).filter(function(c){ return !S.some(function(s){ return s.cause===c.id; }); }); }
function impOk(r){ var S=sols(r); return S.length>0&&!untied(r).length&&!unpiloted(r).length&&!unrisk(r).length&&S.every(function(s){ return !!s.dec; })&&S.some(function(s){ return s.dec==="roll"||s.dec==="adapt"; }); }
function cpRows(r){ return r.ctl.plan.filter(function(x){ return txt(x.m); }); }
function cpBad(r){ return cpRows(r).filter(function(x){ return !txt(x.freq)||!txt(x.who)||!txt(x.react); }); }
function cplanOk(r){ return cpRows(r).length>0&&!cpBad(r).length; }
function afterOk(r){ var c=r.ctl; return !!(txt(c.measure)&&c.same&&isD(c.from)&&isD(c.to)&&c.from<=c.to&&afterStats(r).n>=MINPTS&&c.res); }
function stdOk(r){ var c=r.ctl; return !!txt(c.std)||(c.res==="not"&&!!txt(c.open)); }
function handOk(r){ return !!txt(r.ctl.handTo)&&isD(r.ctl.hdate); }
function ctlOk(r){ return cplanOk(r)&&afterOk(r)&&stdOk(r)&&handOk(r); }
var PHOK={D:defOk,M:measOk,A:anOk,I:impOk,C:ctlOk};
/* a gate is passed when the sponsor's review is dated, names a reviewer other than the project lead, records the questions and decides "go" */
function gatePass(r,p){ var g=r.gates[p]; return g.dec==="go"&&isD(g.date)&&!!txt(g.by)&&!!txt(g.q)&&!(txt(r.lead)&&low(g.by)===low(r.lead)); }
function stopAt(r){ for(var i=0;i<PH.length;i++){ var g=r.gates[PH[i]]; if(g.dec==="stop"&&isD(g.date)) return PH[i]; } return ""; }
function stageOf(r){
 var s=stopAt(r); if(s) return "stop";
 for(var i=0;i<PH.length;i++){ var p=PH[i]; if(!(PHOK[p](r)&&gatePass(r,p))) return p; }
 return "closed";
}
function stageName(s){ return t("st_"+s); }
function idxOf(r){ var s=stageOf(r); return s==="stop"?PH.indexOf(stopAt(r)):STAGES.indexOf(s); }
function atLeast(r,p){ return idxOf(r)>=STAGES.indexOf(p); }
/* phases whose content is complete, whether or not their gate was passed */
function doneContent(r){ return PH.filter(function(p){ return PHOK[p](r); }); }

/* ---------- automatic audit of studies ---------- */
var CHECKS=["ref","team","scales","struct","rows","cover","human","high","sev","rerate","review","capa"];
function auditRecord(r){
 var R=rowsOf(r), A=acts(r), D=A.filter(function(a){ return a.st==="done"; }), lowered=A.filter(function(a){ var w=rowById(r,a.row); return w&&w.s&&a.ns&&a.ns<w.s; });
 return {
  ref:refOk(r),
  team:scopeOk(r),
  scales:anyRated(r)||isD(r.sc.date)?scalesOk(r):null,
  struct:structOk(r),
  rows:R.length?!incRows(r).length:null,
  cover:R.length?!uncovered(r).length:null,
  human:R.length?!humanRows(r).length:null,
  high:hiRows(r).length?!hiOpen(r).length:null,
  sev:lowered.length?!sevBads(r).length:null,
  rerate:D.length?!doneNotRe(r).length:null,
  review:(doneOk(r)||revs(r).length)?revOk(r):null,
  capa:capaNeed(r)?!!txt(r.capa):null
 };
}
function auditSummary(){ var A=TBX.audit(DB.records,auditRecord,CHECKS); return {pass:A.pass,applic:A.applic,rate:A.rate,failRec:A.failRec}; }
function renderAudit(){
 var box=document.getElementById("auBox"), kp=document.getElementById("auKpis"); if(!box) return;
 if(!DB.records.length){ box.innerHTML='<div class="pd-empty">'+esc(t("auEmpty"))+'</div>'; kp.innerHTML=""; return; }
 var A=TBX.audit(DB.records,auditRecord,CHECKS);
 var rows=A.rows.map(function(x){ return '<tr><td>'+esc(x.r.title)+'<br><small dir="ltr">'+esc(x.r.ref||x.r.id)+'</small></td>'+TBX.cells(x.res,CHECKS)+'</tr>'; }).join("");
 box.innerHTML='<table class="pd-tbl"><thead><tr><th>'+esc(t("colRef"))+'</th>'+CHECKS.map(function(k){ return '<th>'+esc(t("c_"+k))+'</th>'; }).join("")+'</tr></thead><tbody>'+rows+'</tbody></table>';
 kp.innerHTML=TBX.kpi(DB.records.length,t("auRec"))+TBX.kpi(A.rate===null?"—":A.rate+"%",t("auPass"))+TBX.kpi(A.failRec,t("auFail"))+TBX.kpi(openItems().length,t("auOpen"));
}

/* ---------- dashboard ---------- */
/* a study counts as "high rows acted on" when it has analysis rows and every high-priority row has an owned action;
   "re-rated" when it has actions and every one is done and re-rated with evidence */
function hiActed(r){ return rowsOf(r).length>0&&!hiOpen(r).length; }
function allRe(r){ var A=acts(r); return A.length>0&&A.every(reRated); }
function counts(){
 var R=DB.records, c={n:R.length,hi:0,re:0,rows:0,hr:0,ho:0,human:0,ap:{H:0,M:0,L:0},src:{}};
 SRCS.forEach(function(s){ c.src[s]=0; });
 R.forEach(function(r){ var a=apCounts(r); if(hiActed(r)) c.hi++; if(allRe(r)) c.re++; c.rows+=rowsOf(r).length; c.hr+=hiRows(r).length; c.ho+=hiOpen(r).length; c.human+=humanRows(r).length;
  c.ap.H+=a.H; c.ap.M+=a.M; c.ap.L+=a.L; c.src[r.src]++; });
 return c;
}
function pct(a,n){ return n?Math.round(a/n*100)+"%":"—"; }
function allBefore(){ var o=[]; DB.records.forEach(function(r){ o=o.concat(beforePts(r)); }); return o; }
function renderDash(){
 var box=document.getElementById("dKpis"); if(!box) return;
 var c=counts(), au=auditSummary(), as=assessScore(), n=c.n, oi=openItems(), nr=c.ap.H+c.ap.M+c.ap.L;
 box.innerHTML=TBX.kpi(n,t("kTotal"))+TBX.kpi(pct(c.hi,n),t("kHigh"))+TBX.kpi(pct(c.re,n),t("kRe"))+TBX.kpi(c.rows,t("kRows"))+TBX.kpi(c.hr,t("kHrows"))+TBX.kpi(c.ho,t("kHopen"))+TBX.kpi(c.human,t("kHuman"))+TBX.kpi(oi.length,t("kOpen"))+TBX.kpi(au.rate===null?"—":au.rate+"%",t("kAud"))+TBX.kpi(as+"%",t("kAs"));
 var nd='<p class="pd-sub" style="color:var(--ink-soft)">'+esc(t("noData"))+'</p>';
 document.getElementById("dStage").innerHTML=n?TBX.dist(STAGES,n,function(s){ return DB.records.filter(function(r){ return stageOf(r)===s; }).length; },stageName,function(s){ return SCOL[s]; }):nd;
 document.getElementById("dAp").innerHTML=nr?TBX.dist(["H","M","L"],nr,function(k){ return c.ap[k]; },function(k){ return t("ap_"+k); },function(k){ return APCOL[k]; }):nd;
 document.getElementById("dSrc").innerHTML=n?TBX.dist(SRCS,n,function(k){ return c.src[k]; },function(k){ return t("src_"+k); },function(){ return "#1B2A4A"; }):nd;
 document.getElementById("dAssess").innerHTML=AGROUPS.map(function(g){ var p=assessScore(g); return TBX.bar(t("g_"+g),p+"%",p,GCOL[g]); }).join("")+'<p class="pd-sub" style="font-size:12.5px;color:var(--muted);margin:10px 0 0">'+esc(t("bandNote"))+'</p>';
 var dh=document.getElementById("dHeat"); if(dh) dh.innerHTML=heatSVG(allBefore(),{lang:L,W:chartW(),title:t("dHeatT")});
 document.getElementById("dOpen").innerHTML=oi.length?oi.map(function(x){ return '<li><b>'+esc(x.r.ref||x.r.id)+'</b>'+chip([x.r.id,"info"])+'<span>'+esc(x.s)+'</span></li>'; }).join(""):'<li>'+esc(n?t("noOpen"):t("noData"))+'</li>';
}
