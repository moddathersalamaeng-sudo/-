<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Continual Improvement Academy — Academy Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@500;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F7FB; --surface:#FFFFFF; --ink:#1B2A4A; --ink-soft:#4B5874; --muted:#6F7B93; --line:#DCE4EE;
  --gold:#B8901E; --gold-ink:#7A5E10; --gold-tint:#FBF4DF; --navy:#1B2A4A; --on-navy:#FFFFFF;
  --c-iso:#1E8C93; --c-grc:#7B5BB8; --c-pmo:#3563C9; --c-exc:#B8901E; --c-str:#3C9A5F; --c-aud:#C9821A; --c-ai:#C2410C;
  --live:#2F8A55; --dev:#B7791F; --plan:#7A869E;
  --radius-lg:24px; --radius:14px; --radius-sm:9px;
  --display:"Fraunces",Georgia,serif; --body:"IBM Plex Sans","Segoe UI",Helvetica,Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html[lang="ar"]{--display:"Noto Kufi Arabic","IBM Plex Sans Arabic",Tahoma,sans-serif;--body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1729; --surface:#15213A; --ink:#E7ECF4; --ink-soft:#B6C0D2; --muted:#8C98AE; --line:#2A3A58;
    --gold:#D6B04A; --gold-ink:#E7CB7A; --gold-tint:#2A2717; --navy:#0A1222; --on-navy:#FFFFFF;
    --c-iso:#3DB5BC; --c-grc:#A58BE0; --c-pmo:#6F95EA; --c-exc:#D6B04A; --c-str:#5DBE80; --c-aud:#E3A043; --c-ai:#EC6A3A;
    --live:#5DBE80; --dev:#E3A043; --plan:#8C98AE;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1729; --surface:#15213A; --ink:#E7ECF4; --ink-soft:#B6C0D2; --muted:#8C98AE; --line:#2A3A58;
  --gold:#D6B04A; --gold-ink:#E7CB7A; --gold-tint:#2A2717; --navy:#0A1222; --on-navy:#FFFFFF;
  --c-iso:#3DB5BC; --c-grc:#A58BE0; --c-pmo:#6F95EA; --c-exc:#D6B04A; --c-str:#5DBE80; --c-aud:#E3A043; --c-ai:#EC6A3A;
  --live:#5DBE80; --dev:#E3A043; --plan:#8C98AE;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 76px)}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased}
html[lang="ar"] body{font-size:16.5px;line-height:1.85}
img,svg{max-width:100%}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:6px}
.wrap{max-width:1180px;margin-inline:auto;padding-inline:22px}
.ltr{direction:ltr;unicode-bidi:isolate}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;justify-content:space-between;gap:14px;height:64px}
.brand{display:flex;align-items:center;gap:11px;text-decoration:none;min-width:0}
.brand img{width:40px;height:40px;border-radius:50%;flex:none;background:#fff}
.brand b{font-family:var(--display);font-size:15px;line-height:1.25;display:block;white-space:nowrap}
.brand span{font-size:12.5px;color:var(--muted);display:block;white-space:nowrap}
.nav{display:flex;gap:2px}
.nav a{color:var(--ink-soft);text-decoration:none;font-size:14px;padding:7px 12px;border-radius:999px;white-space:nowrap}
.nav a:hover{background:var(--bg);color:var(--ink)}
.bar-right{display:flex;align-items:center;gap:8px}
.lang{display:inline-flex;align-items:center;gap:8px;border:0;background:var(--navy);color:var(--on-navy);border-radius:999px;padding:8px 15px;font-size:14px;font-weight:600;cursor:pointer}
.lang:hover{filter:brightness(1.18)}
@media (max-width:1020px){.nav{display:none}}
@media (max-width:460px){.brand span{display:none}.brand b{font-size:14px}}

/* hero */
.hero{padding-block:46px 30px}
.hero-grid{display:grid;grid-template-columns:1.05fr 1fr;gap:34px;align-items:center}
.hero-grid>*{min-width:0}
@media (max-width:900px){.hero-grid{grid-template-columns:1fr}}
.kicker{display:inline-flex;align-items:center;gap:9px;background:var(--gold-tint);color:var(--gold-ink);border:1px solid color-mix(in srgb,var(--gold) 35%,transparent);padding:6px 14px;border-radius:999px;font-size:14px;font-weight:600}
.kicker i{width:8px;height:8px;border-radius:50%;background:var(--live);box-shadow:0 0 0 4px color-mix(in srgb,var(--live) 22%,transparent)}
.hero h1{font-family:var(--display);font-weight:700;font-size:clamp(34px,5.4vw,62px);line-height:1.08;letter-spacing:-.02em;margin:18px 0 16px}
html[lang="ar"] .hero h1{font-weight:800;letter-spacing:0;line-height:1.35;font-size:clamp(30px,4.6vw,54px)}
.hero .lede{font-size:18px;color:var(--ink-soft);max-width:54ch;margin:0}
.cta-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}
.btn{display:inline-flex;align-items:center;gap:9px;border-radius:12px;padding:12px 18px;font-weight:600;font-size:15px;text-decoration:none;cursor:pointer;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
.btn:hover{border-color:var(--ink-soft)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
.btn.primary:hover{filter:brightness(1.18)}
.btn svg{flex:none}
html[dir="rtl"] .flip{transform:scaleX(-1)}
.facts{display:flex;flex-wrap:wrap;gap:22px;margin-top:30px;padding-top:20px;border-top:1px solid var(--line)}
.fact b{font-family:var(--display);font-size:26px;display:block;line-height:1.1}
.fact span{font-size:13.5px;color:var(--muted)}
.author{display:flex;align-items:center;gap:10px;margin-top:22px;font-size:14.5px;color:var(--muted)}
.author strong{color:var(--ink);font-family:var(--display);font-size:17px}

/* orbit */
.orbit-wrap{position:relative}
#orbit{display:block;width:100%;height:auto;max-width:600px;margin-inline:auto;overflow:visible}
#orbit .node{cursor:pointer}
#orbit .node:focus{outline:none}
#orbit .node:focus-visible .ring{stroke:var(--gold);stroke-width:4}
#orbit .node:hover .disc{filter:drop-shadow(0 8px 14px rgba(20,30,60,.22))}
#orbit text{font-family:var(--body);pointer-events:none}
#orbit .spoke{stroke:var(--line);stroke-width:1.5}
#orbit .loop{fill:none;stroke:var(--gold);stroke-width:1.6;stroke-dasharray:3 9;stroke-linecap:round;opacity:.9}
.orbit-in .node{opacity:0;transform-box:fill-box;transform-origin:center;animation:pop .5s cubic-bezier(.2,.8,.2,1.2) forwards}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
.orbit-cap{text-align:center;font-size:13.5px;color:var(--muted);margin-top:4px}
#orbit .node .disc{transition:transform .35s,stroke-width .25s;transform-box:fill-box;transform-origin:center}
#orbit .node.sel .disc{transform:scale(1.14);stroke:var(--gold);stroke-width:5}
#orbit .spoke.sel{stroke:var(--gold);stroke-width:3}
#orbit .pulse{fill:none;stroke:var(--gold);stroke-width:2;opacity:.55}
.orb-panel{margin:14px auto 0;max-width:600px;background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--c,var(--gold));border-radius:var(--radius);padding:14px 16px;box-shadow:0 10px 26px rgba(20,30,60,.08)}
.orb-h{display:flex;align-items:center;gap:10px}
.orb-h h3{margin:0;font-family:var(--display);font-size:18px;line-height:1.35;flex:1}
.orb-h small{color:var(--muted);font-weight:600}
.orb-nav{border:1px solid var(--line);background:var(--surface);color:var(--ink);width:34px;height:34px;border-radius:50%;cursor:pointer;display:grid;place-items:center;font-size:16px;flex:none}
.orb-nav:hover{border-color:var(--ink-soft)}
.orb-sub{margin:6px 0 10px;font-size:14px;color:var(--ink-soft)}
.orb-list{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.orb-list li{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:14px}
.orb-list li b{display:block;font-weight:700}.orb-list li span.n{font-size:12.5px;color:var(--muted)}
.orb-list li .grow{flex:1;min-width:0}
.orb-list .dot{width:10px;height:10px;border-radius:50%;flex:none}
.orb-list a.go{background:var(--c,var(--navy));color:#fff;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700;text-decoration:none;white-space:nowrap}
.orb-list em{font-style:normal;font-size:12.5px;color:var(--muted);white-space:nowrap}
.orb-f{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;font-size:13.5px}
.orb-f button,.orb-f a{background:none;border:0;color:var(--ink-soft);font:inherit;font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px;padding:0}

/* sections */
section{padding:50px 0}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;flex-wrap:wrap;margin-bottom:24px}
.sec-head h2{font-family:var(--display);font-size:clamp(26px,3.2vw,36px);line-height:1.2;margin:0}
html[lang="ar"] .sec-head h2{line-height:1.5}
.sec-head p{margin:8px 0 0;color:var(--ink-soft);max-width:62ch}
.band{background:var(--surface);border-block:1px solid var(--line)}

/* live toolkits */
.tk-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media (max-width:1200px){.tk-grid{grid-template-columns:repeat(3,1fr)}}@media (max-width:860px){.tk-grid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:560px){.tk-grid{grid-template-columns:1fr}}
.tk{--c:var(--c-iso);position:relative;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px 20px 20px;overflow:hidden}
.tk::before{content:"";position:absolute;inset-inline:0;top:0;height:5px;background:var(--c)}
.tk .code{font-family:Georgia,"Times New Roman",serif;font-weight:700;font-size:40px;line-height:1;letter-spacing:-1px;direction:ltr;text-align:start;color:var(--ink)}
html[dir="rtl"] .tk .code{text-align:right}
.tk .code small{display:block;font-size:14px;letter-spacing:0;font-weight:400;color:var(--c);margin-top:8px;font-family:var(--body)}
.tk .code .pre{font-size:15px;letter-spacing:.5px;font-weight:600;color:var(--muted);display:block;margin-bottom:4px}
.tk h3{font-family:var(--display);font-size:17px;line-height:1.4;margin:14px 0 10px}
.tk ul{list-style:none;padding:0;margin:0 0 18px;display:grid;gap:6px;font-size:14px;color:var(--ink-soft)}
.tk li{display:flex;gap:8px;align-items:flex-start}
.tk li::before{content:"";width:6px;height:6px;border-radius:2px;background:var(--c);flex:none;margin-top:.7em}
.tk .btn{margin-top:auto;justify-content:center;background:color-mix(in srgb,var(--c) 10%,var(--surface));border-color:color-mix(in srgb,var(--c) 45%,transparent);color:var(--ink)}
.tk .btn:hover{background:var(--c);border-color:var(--c);color:#fff}
.tk .live-tag{position:absolute;top:16px;inset-inline-end:16px;font-size:12px;font-weight:600;color:var(--live);display:flex;align-items:center;gap:6px}
.tk .live-tag i{width:7px;height:7px;border-radius:50%;background:var(--live)}

/* systems */
.filters{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.dot.live{background:var(--live)} .dot.dev{background:var(--dev)} .dot.plan{background:transparent;border:1.5px solid var(--plan)}
.sys-list{display:grid;gap:12px}
.sys{--c:var(--c-iso);display:grid;grid-template-columns:260px 1fr;gap:22px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px 22px;border-inline-start:6px solid var(--c);transition:box-shadow .3s,border-color .3s}
.sys.flash{box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 30%,transparent)}
@media (max-width:820px){.sys{grid-template-columns:1fr;gap:12px}}
.sys h3{font-family:var(--display);font-size:19px;line-height:1.35;margin:0 0 6px}
.sys .sys-sub{font-size:14px;color:var(--ink-soft);margin:0}
.sys .notify{display:inline-flex;align-items:center;gap:6px;margin-top:12px;font-size:13.5px;font-weight:600;color:var(--c);text-decoration:none}
.sys .notify:hover{text-decoration:underline}
.mods{display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start}
.mod{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14px;background:var(--bg);text-decoration:none;color:var(--ink);transition:opacity .2s}
.mod small{color:var(--muted);font-size:12.5px}
a.mod{border-color:color-mix(in srgb,var(--live) 45%,transparent);background:color-mix(in srgb,var(--live) 9%,var(--surface));font-weight:600}
a.mod:hover{border-color:var(--live)}
.mod.dim{opacity:.28}
.legend{display:flex;flex-wrap:wrap;gap:16px;font-size:13.5px;color:var(--muted);margin-top:16px}
.legend span{display:inline-flex;align-items:center;gap:7px}

/* journey */
.journey{display:grid;grid-template-columns:repeat(6,1fr);gap:0;counter-reset:st;position:relative}
@media (max-width:900px){.journey{grid-template-columns:repeat(3,1fr);row-gap:22px}}
@media (max-width:520px){.journey{grid-template-columns:repeat(2,1fr)}}
.st{position:relative;padding-inline-end:14px}
.st .n{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-family:Georgia,serif;font-weight:700;background:var(--surface);border:2px solid var(--gold);color:var(--ink);position:relative;z-index:1}
.st:last-child .n{background:var(--gold);color:#fff}
.st::after{content:"";position:absolute;top:19px;inset-inline-start:38px;inset-inline-end:0;height:2px;background:var(--line)}
.st:last-child::after{display:none}
@media (max-width:900px){.st:nth-child(3n)::after{display:none}}
@media (max-width:520px){.st::after{display:none}}
.st b{display:block;font-family:var(--display);font-size:16.5px;margin-top:12px;line-height:1.35}
.st span{font-size:13.5px;color:var(--ink-soft);display:block;margin-top:4px;line-height:1.55}
.loop-note{margin-top:22px;font-size:14px;color:var(--muted);display:flex;align-items:center;gap:8px}
.inside{margin-top:40px;background:var(--bg);border:1px solid var(--line);border-radius:20px;padding:22px}
.inside h3{font-family:var(--display);font-size:19px;margin:0 0 4px}
.inside p{margin:0 0 16px;color:var(--ink-soft);font-size:14.5px}
.tabs-demo{display:flex;flex-wrap:wrap;gap:8px}
.tabs-demo span{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14px}
.tabs-demo span i{font-style:normal;font-family:Georgia,serif;font-weight:700;color:var(--gold);font-size:13px}

/* IMS matrix */
.table-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:18px;background:var(--surface)}
table{width:100%;border-collapse:collapse;min-width:1060px;font-size:14.5px}
th,td{padding:11px 14px;text-align:start;border-bottom:1px solid var(--line);vertical-align:top}
thead th{background:color-mix(in srgb,var(--navy) 6%,var(--surface));font-size:13.5px;color:var(--ink-soft);font-weight:600;position:sticky;top:0}
thead th.std{text-align:center;direction:ltr;width:140px}
td.proc{min-width:210px;font-weight:500}
td.chk{text-align:center;color:var(--live);font-weight:700}
td.cl{direction:ltr;text-align:start;color:var(--muted);font-family:Georgia,serif;white-space:nowrap}
html[dir="rtl"] td.cl{text-align:right}
td.out{color:var(--ink-soft);min-width:210px}
tr.grp th{background:var(--gold-tint);color:var(--gold-ink);font-size:13.5px}
td.spec{font-size:13.5px;color:var(--ink-soft);text-align:start}
tbody tr:last-child td{border-bottom:0}
.ims-foot{display:flex;gap:14px;align-items:flex-start;margin-top:18px;background:var(--gold-tint);border:1px solid color-mix(in srgb,var(--gold) 35%,transparent);border-radius:14px;padding:14px 16px;font-size:14.5px;color:var(--gold-ink)}

/* roadmap */
.road{position:relative;display:grid;gap:0}
.wave{display:grid;grid-template-columns:64px 1fr;gap:16px;position:relative;padding-bottom:22px}
.wave::before{content:"";position:absolute;top:44px;bottom:0;inset-inline-start:31px;width:2px;background:var(--line)}
.wave:last-child::before{display:none}
.wave .wn{width:64px;height:44px;border-radius:12px;display:grid;place-items:center;font-family:Georgia,serif;font-weight:700;font-size:15px;border:1.5px solid var(--line);background:var(--surface);color:var(--muted);position:relative;z-index:1}
.wave.done .wn{background:var(--live);border-color:var(--live);color:#fff}
.wave.dev .wn{border-color:var(--dev);color:var(--dev);background:color-mix(in srgb,var(--dev) 10%,var(--surface))}
.wave .wb{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px}
.wave.done .wb{border-color:color-mix(in srgb,var(--live) 40%,transparent)}
.wave.dev .wb{border-color:color-mix(in srgb,var(--dev) 50%,transparent)}
.wave .wt{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.wave h3{font-family:var(--display);font-size:17px;margin:0;line-height:1.4}
.wave p{margin:4px 0 0;font-size:14px;color:var(--ink-soft)}
.st-tag{font-size:12.5px;font-weight:600;border-radius:999px;padding:3px 10px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.st-tag.live{background:color-mix(in srgb,var(--live) 14%,var(--surface));color:var(--live)}
.st-tag.dev{background:color-mix(in srgb,var(--dev) 14%,var(--surface));color:var(--dev)}
.st-tag.plan{background:var(--bg);color:var(--muted)}
.milestone{margin:4px 0 26px;margin-inline-start:80px;border:1.5px dashed var(--gold);border-radius:14px;padding:12px 16px;font-size:14px;color:var(--gold-ink);background:var(--gold-tint)}
@media (max-width:560px){.wave{grid-template-columns:52px 1fr;gap:12px}.wave .wn{width:52px;font-size:13px}.wave::before{inset-inline-start:25px}.milestone{margin-inline-start:0}}

/* knowledge */
.kpath{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;counter-reset:k}
@media (max-width:900px){.kpath{grid-template-columns:repeat(2,1fr)}}
@media (max-width:560px){.kpath{grid-template-columns:1fr}}
details.k{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0}
details.k summary{list-style:none;cursor:pointer;padding:15px 16px;display:flex;align-items:center;gap:12px;font-family:var(--display);font-size:16.5px;font-weight:600}
details.k summary::-webkit-details-marker{display:none}
details.k summary .kn{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-family:Georgia,serif;font-size:13px;font-weight:700;background:var(--gold-tint);color:var(--gold-ink);flex:none}
details.k summary .chev{margin-inline-start:auto;transition:transform .2s;color:var(--muted);flex:none}
details.k[open] summary .chev{transform:rotate(180deg)}
details.k .kb{padding:0 16px 16px;font-size:14.5px;color:var(--ink-soft)}
details.k .kb p{margin:0}
details.k .kb .rel{margin-top:10px;font-size:13px;color:var(--muted)}

/* about */
.about{display:grid;grid-template-columns:180px 1fr;gap:30px;align-items:center;background:var(--navy);color:#E9EEF7;border-radius:var(--radius-lg);padding:30px}
@media (max-width:700px){.about{grid-template-columns:1fr;text-align:center}.about img{margin-inline:auto}}
.about img{width:180px;height:180px;border-radius:50%;background:#fff;display:block}
.about h2{font-family:var(--display);font-size:clamp(24px,3vw,32px);margin:0 0 6px;color:#fff}
.about .role{color:#E2C46B;font-weight:600;margin:0 0 12px}
.about p{margin:0 0 10px;color:#C9D3E4;max-width:66ch}
@media (max-width:700px){.about p{margin-inline:auto}}
.contact{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
@media (max-width:700px){.contact{justify-content:center}}
.contact .btn{background:transparent;border-color:rgba(255,255,255,.3);color:#fff}
.contact .btn:hover{border-color:#fff}
.contact .btn.gold{background:#D6B04A;border-color:#D6B04A;color:#1B2A4A}

footer{padding:34px 0 40px;font-size:13px;color:var(--muted)}
footer .wrap{display:grid;gap:8px}
footer strong{color:var(--ink)}

.toast{position:fixed;inset-inline:0;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);margin-inline:auto;width:max-content;max-width:90vw;background:var(--navy);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;transform:translateY(10px);transition:.25s;pointer-events:none;z-index:50}
.toast.on{opacity:1;transform:none}

/* request forms */
.rq-grid[hidden],.rq-done[hidden],.rq-err-top[hidden]{display:none!important}
.rq-switch{display:inline-flex;gap:6px;padding:5px;border-radius:14px;background:var(--bg);border:1px solid var(--line);margin-bottom:18px;flex-wrap:wrap}
.rq-switch button{display:inline-flex;align-items:center;gap:8px;border:0;background:transparent;color:var(--ink-soft);font:inherit;font-weight:700;font-size:15px;padding:10px 16px;border-radius:10px;cursor:pointer}
.rq-switch button[aria-selected="true"]{background:var(--navy);color:#fff}
.rq-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
@media (max-width:900px){.rq-grid{grid-template-columns:1fr}}
.rq-form{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:24px}
.rq-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 16px;align-items:start}
@media (max-width:620px){.rq-fields{grid-template-columns:1fr}}
.rq-f{display:grid;align-content:start;gap:6px;font-size:14px;font-weight:600;color:var(--ink);margin:0;border:0;padding:0;min-width:0}
.rq-f.full{grid-column:1/-1}
.rq-f legend{padding:0;margin-bottom:6px}
.rq-f input,.rq-f select,.rq-f textarea{width:100%;font:inherit;font-weight:500;font-size:15px;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:11px;padding:11px 12px;outline:none}
.rq-f textarea{resize:vertical;min-height:110px}
.rq-f input:focus,.rq-f select:focus,.rq-f textarea:focus{border-color:var(--gold);background:var(--surface);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 22%,transparent)}
.rq-f.bad input,.rq-f.bad select,.rq-f.bad textarea{border-color:#C2410C}
.rq-msg{color:#C2410C;font-weight:600;font-size:12.5px;min-height:0}
.rq-msg:empty{display:none}
.rq-star{color:var(--gold);font-weight:800}
.rq-chips{display:flex;flex-wrap:wrap;gap:7px}
.rq-chip{border:1.5px solid var(--line);background:var(--surface);color:var(--ink-soft);border-radius:999px;padding:7px 13px;font:inherit;font-size:13.5px;font-weight:600;cursor:pointer}
.rq-chip:hover{border-color:var(--ink-soft)}
.rq-chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.rq-f.bad .rq-chips{outline:1.5px dashed #C2410C;outline-offset:4px;border-radius:12px}
.rq-consent{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;margin-top:18px;font-size:14px;color:var(--ink-soft)}
.rq-consent input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--navy)}
.rq-consent .rq-msg{grid-column:2}
.rq-consent.bad span{color:#C2410C}
.rq-actions{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:20px}
.rq-actions .btn[disabled]{opacity:.6;cursor:wait}
.rq-note{font-size:13px;color:var(--muted)}
.rq-err-top{background:#FDECE3;color:#9A3412;border-radius:11px;padding:10px 14px;font-weight:600;margin-bottom:14px}
.rq-side{background:var(--navy);color:#E9EEF7;border-radius:var(--radius-lg);padding:22px;position:sticky;top:90px}
.rq-side h3{font-family:var(--display);margin:0 0 14px;color:#fff;font-size:19px}
.rq-side ol{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.rq-side li{display:grid;grid-template-columns:32px 1fr;gap:10px}
.rq-side li i{font-style:normal;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:#D6B04A;color:#1B2A4A;font-weight:800}
.rq-side li b{display:block;color:#fff}.rq-side li span{font-size:13.5px;color:#C9D3E4;line-height:1.55;display:block}
.rq-to{margin-top:18px;padding-top:14px;border-top:1px solid rgba(255,255,255,.15);display:grid;gap:6px;font-size:13px}
.rq-to span{color:#E2C46B;font-weight:700}.rq-to code{font-size:13px;color:#fff;background:rgba(255,255,255,.08);padding:5px 8px;border-radius:8px;word-break:break-all}
.rq-done{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:26px}
.rq-done-in{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:start}
@media (max-width:620px){.rq-done-in{grid-template-columns:1fr}}
.rq-ok{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:#E5F4EA;color:#2F8A55}
.rq-done h3{font-family:var(--display);font-size:24px;margin:0 0 6px}
.rq-done p{margin:0 0 10px;color:var(--ink-soft)}
.rq-ref b{font-family:Georgia,serif;color:var(--ink);font-size:17px}
.rq-btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.rq-btns.sub .btn{padding:9px 14px;font-size:14px}
.rq-prev{margin-top:14px;font-size:13.5px}
.rq-prev summary{cursor:pointer;color:var(--ink-soft);font-weight:600}
.rq-prev pre{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:14px;font:inherit;font-size:13.5px;margin:10px 0 0;max-height:320px;overflow:auto}
.about .contact{flex-wrap:wrap}
</style>
</head>

/* orbit */
function renderOrbit(animate){
  const u = UI[L], svg = $("orbit");
  const C = 320, R = 222, NR = 60;
  let out = `<circle class="loop" cx="${C}" cy="${C}" r="${R}"/>`;
  const pts = SYSTEMS.map((s,i)=>{ const a = -Math.PI/2 + i*2*Math.PI/SYSTEMS.length; const dir = L==="ar"?-1:1;
    return [C + R*Math.cos(a)*dir, C + R*Math.sin(a)]; });
  out += pts.map(([x,y])=>`<line class="spoke" x1="${C}" y1="${C}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}"/>`).join("");
  // center
  const surf = cssv("--surface"), navy = cssv("--navy"), gold = cssv("--gold"), ink = cssv("--ink"), muted = cssv("--muted");
  out += `<circle cx="${C}" cy="${C}" r="92" fill="${navy}" stroke="${gold}" stroke-width="3"/>`;
  out += `<circle cx="${C}" cy="${C}" r="80" fill="none" stroke="${gold}" stroke-opacity=".35" stroke-width="1"/>`;
  const cl = u.center.filter(Boolean);
  out += cl.map((t,i)=>`<text x="${C}" y="${C + (i - (cl.length-1)/2)*26 + 8}" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">${esc(t)}</text>`).join("");
  out += `<text x="${C}" y="${C + (cl.length>1?54:40)}" text-anchor="middle" font-size="13" fill="${gold}" style="direction:ltr">CIA</text>`;
  // nodes
  out += SYSTEMS.map((s,i)=>{
    const [x,y] = pts[i]; const col = cssv(s.color); const st = sysStatus(s);
    const live = st==="live";
    const lines = s.short[L]; const lc = live? "#fff" : ink;
    const statusTxt = live ? u.liveN(countLive(s)) : (st==="dev"?u.devW:u.planW);
    const ty0 = y - (lines.length-1)*10 - 6;
    return `<g class="node" tabindex="0" role="button" data-id="${s.id}" aria-label="${esc(s.name[L])} — ${esc(statusTxt)}" style="animation-delay:${animate? (120+i*90):0}ms">
      <circle class="disc ring" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${NR}" fill="${live?col:surf}" stroke="${col}" stroke-width="${live?0:2.5}" ${st==="plan"?'stroke-dasharray="5 5"':""}/>
      ${lines.map((t,j)=>`<text x="${x.toFixed(1)}" y="${(ty0 + j*20).toFixed(1)}" text-anchor="middle" font-size="16" font-weight="700" fill="${lc}">${esc(t)}</text>`).join("")}
      <text x="${x.toFixed(1)}" y="${(ty0 + lines.length*20 + 4).toFixed(1)}" text-anchor="middle" font-size="12.5" font-weight="600" fill="${live?"#fff":(st==="dev"?cssv("--dev"):muted)}">${esc(statusTxt)}</text>
    </g>`;
  }).join("");
  svg.innerHTML = out;
  svg.classList.toggle("orbit-in", !!animate);
  svg.querySelectorAll(".node").forEach(g=>{
    const pick = ()=>{ orbStop(); orbSelect(SYSTEMS.findIndex(x=>x.id===g.dataset.id)); };
    g.addEventListener("click",pick);
    g.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); pick(); } });
  });
  const wrap = svg.closest(".orbit-wrap");
  if(wrap && !wrap.dataset.hov){ wrap.dataset.hov="1"; wrap.addEventListener("mouseenter",()=>{orbHover=true;}); wrap.addEventListener("mouseleave",()=>{orbHover=false;}); }
  orbSelect(orbSel, true);
  orbStart();
}
/* interactive orbit: auto tour + pick a system and its modules */
let orbSel = 0, orbTimer = null, orbHover = false, orbUser = false;
const orbReduced = ()=>matchMedia("(prefers-reduced-motion:reduce)").matches;
function orbStart(){ clearInterval(orbTimer); if(orbUser || orbReduced()) return; orbTimer = setInterval(()=>{ if(orbHover || document.hidden) return; orbSelect((orbSel+1)%SYSTEMS.length, true); }, 3800); }
function orbStop(){ orbUser = true; clearInterval(orbTimer); orbTimer = null; }
function orbSelect(i, auto){
  if(i<0) i=0; orbSel = i; const s = SYSTEMS[i], svg = $("orbit"); if(!s||!svg) return;
  const u = UI[L], o = u.orb, col = cssv(s.color);
  svg.querySelectorAll(".node").forEach(g=>g.classList.toggle("sel", g.dataset.id===s.id));
  svg.querySelectorAll(".spoke").forEach((l,k)=>l.classList.toggle("sel", k===i));
  const liveN = countLive(s), st = sysStatus(s);
  const items = s.mods.map(m=>{ const url = m.status==="live" ? (URLS[m.k]||m.url) : null; const dc = m.status==="live"?"var(--live)":m.status==="dev"?"var(--dev)":"var(--plan)";
    return `<li><span class="dot" style="background:${dc}"></span><span class="grow"><b>${esc(m.name[L])}</b><span class="n">${esc(m.note[L])}</span></span>${url?`<a class="go" href="${url}" target="_blank" rel="noopener">${esc(o.open)} ${EXT}</a>`:`<em>${esc(m.status==="dev"?u.devW:o.soon)}</em>`}</li>`; }).join("");
  const p = $("orbPanel"); if(!p) return; p.style.setProperty("--c", col);
  p.innerHTML = `<div class="orb-h"><button type="button" class="orb-nav" data-d="-1" aria-label="${esc(o.prev)}">${L==="ar"?"›":"‹"}</button><h3>${esc(s.name[L])} <small>· ${s.mods.length} ${esc(o.mods)} · ${esc(st==="live"?u.liveN(liveN):st==="dev"?u.devW:u.planW)}</small></h3><button type="button" class="orb-nav" data-d="1" aria-label="${esc(o.next)}">${L==="ar"?"‹":"›"}</button></div>
    <p class="orb-sub">${esc(s.sub[L])}</p><ul class="orb-list">${items}</ul>
    <div class="orb-f"><button type="button" id="orbTour">${esc(orbUser?o.play:o.pause)}</button><a href="#sys-${s.id}" id="orbMore">${esc(o.more)}</a></div>`;
  p.querySelectorAll(".orb-nav").forEach(b=>b.onclick=()=>{ orbStop(); orbSelect((orbSel + (+b.dataset.d) + SYSTEMS.length) % SYSTEMS.length); });
  $("orbTour").onclick=()=>{ if(orbUser){ orbUser=false; orbStart(); } else orbStop(); orbSelect(orbSel, true); };
  $("orbMore").onclick=e=>{ e.preventDefault(); orbStop(); const el=$("sys-"+s.id); if(!el) return; el.scrollIntoView({behavior: orbReduced()?"auto":"smooth", block:"center"}); el.classList.add("flash"); setTimeout(()=>el.classList.remove("flash"),1600); };
}

const rqOptLabel=(f,v)=>{const o=(f.opts||[]).find(x=>x[0]===v); return o?o[1][L]:v;};

function renderRequest(){
  const u=RQ[L], box=$("rqForm"); if(!box) return;
  $("qTitle").textContent=u.title; $("qSub").textContent=u.sub;
  $("rqSwitch").innerHTML=["consult","training"].map(k=>`<button type="button" role="tab" aria-selected="${rqKind===k}" data-k="${k}">${k==="consult"?ICO_C:ICO_T}<span>${esc(u.tabs[k])}</span></button>`).join("");
  $("rqSwitch").querySelectorAll("button").forEach(b=>b.onclick=()=>{rqCollect(); rqKind=b.dataset.k; rqLast=null; $("rqDone").hidden=true; document.querySelector(".rq-grid").hidden=false; renderRequest();});
  const F=RQ_FORMS[rqKind], d=rqData[rqKind];
  const lab=f=>`${esc(f.l[L])}${f.req?` <b class="rq-star" aria-hidden="true">*</b>`:""}`;
  let h=`<div class="rq-err-top" id="rqErrTop" role="alert" hidden></div><div class="rq-fields">`;
  F.fields.forEach(f=>{ const id="rq-"+rqKind+"-"+f.k, v=d[f.k];
    const cls=`rq-f${f.full||f.t==="textarea"?" full":""}`;
    if(f.t==="chips"){ const sel=Array.isArray(v)?v:[];
      h+=`<fieldset class="${cls}" data-f="${f.k}"><legend>${lab(f)}</legend><div class="rq-chips">${f.opts.map(o=>`<button type="button" class="rq-chip" aria-pressed="${sel.includes(o[0])}" data-v="${esc(o[0])}">${esc(o[1][L])}</button>`).join("")}</div><small class="rq-msg"></small></fieldset>`; return; }
    h+=`<label class="${cls}" data-f="${f.k}"><span>${lab(f)}</span>`;
    if(f.t==="select") h+=`<select id="${id}" name="${f.k}" ${f.req?"required":""}><option value="">—</option>${f.opts.map(o=>`<option value="${esc(o[0])}" ${v===o[0]?"selected":""}>${esc(o[1][L])}</option>`).join("")}</select>`;
    else if(f.t==="textarea") h+=`<textarea id="${id}" name="${f.k}" rows="4" ${f.req?"required":""} placeholder="${esc(f.ph?f.ph[L]:"")}">${esc(v||"")}</textarea>`;
    else h+=`<input id="${id}" name="${f.k}" type="${f.t}" ${f.t==="email"||f.t==="tel"||f.t==="number"||f.t==="month"?'dir="ltr"':""} ${f.min?`min="${f.min}"`:""} ${f.ac?`autocomplete="${f.ac}"`:""} ${f.req?"required":""} value="${esc(v||"")}" placeholder="${esc(typeof f.ph==="string"?f.ph:(f.ph?f.ph[L]:""))}">`;
    h+=`<small class="rq-msg"></small></label>`; });
  h+=`</div><label class="rq-consent" data-f="consent"><input type="checkbox" id="rqConsent" ${d.consent?"checked":""}><span>${esc(u.consent)} <b class="rq-star">*</b></span><small class="rq-msg"></small></label>
   <div class="rq-actions"><button class="btn primary" type="submit" id="rqSubmit">${esc(u.submit[rqKind])} ${ARROW}</button><span class="rq-note">* ${esc(u.req)}</span></div>`;

function rqCollect(){
  const F=RQ_FORMS[rqKind], d=rqData[rqKind], box=$("rqForm"); if(!box) return;
  F.fields.forEach(f=>{ const w=box.querySelector(`[data-f="${f.k}"]`); if(!w) return;
    if(f.t==="chips") d[f.k]=[...w.querySelectorAll('.rq-chip[aria-pressed="true"]')].map(b=>b.dataset.v);
    else { const el=w.querySelector("input,select,textarea"); d[f.k]=el?el.value.trim():""; } });
  const c=$("rqConsent"); d.consent=c?c.checked:false;
}
function rqClear(w){ if(!w) return; w.classList.remove("bad"); const m=w.querySelector(".rq-msg"); if(m) m.textContent=""; }
function rqValidate(){
  const u=RQ[L], F=RQ_FORMS[rqKind], d=rqData[rqKind], box=$("rqForm"); let first=null;
  const bad=(k,msg)=>{const w=box.querySelector(`[data-f="${k}"]`); if(!w) return; w.classList.add("bad"); const m=w.querySelector(".rq-msg"); if(m) m.textContent=msg; if(!first) first=w;};
  F.fields.forEach(f=>{ const v=d[f.k];
    if(f.req && (f.t==="chips"?!(v&&v.length):!v)) return bad(f.k,f.t==="chips"?u.err.chips:u.err.req);
    if(f.t==="email"&&v&&!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)) return bad(f.k,u.err.email);
    if(f.t==="tel"&&v&&String(v).replace(/\D/g,"").length<7) return bad(f.k,u.err.phone); });
  if(!d.consent) bad("consent",u.err.consent);
  const top=$("rqErrTop"); if(first){ top.hidden=false; top.textContent=u.err.top; first.scrollIntoView({behavior:"smooth",block:"center"}); const el=first.querySelector("input,select,textarea,button"); if(el) setTimeout(()=>el.focus({preventScroll:true}),350); return false; }
  top.hidden=true; return true;
}
function rqRef(){ const d=new Date(), p=n=>String(n).padStart(2,"0"); return `CIA-${RQ_FORMS[rqKind].code}-${String(d.getFullYear()).slice(2)}${p(d.getMonth()+1)}${p(d.getDate())}-${Math.random().toString(36).slice(2,6).toUpperCase()}`; }
function rqCompose(ref){

  const val=f=>{const v=d[f.k]; if(f.t==="chips") return (v||[]).map(x=>rqOptLabel(f,x)).join(", "); if(f.t==="select") return v?rqOptLabel(f,v):""; return v||"";};

  let body=`${u.hello}\n\n${u.intro[rqKind]}\n\n${u.ref}: ${ref}\n`;

  body+=`\n—\n${u.foot} · ${new Date().toISOString().slice(0,16).replace("T"," ")}`;
  const to=RQ_TO.join(",");

    mailto:`mailto:${to}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`,
    gmail:`https://mail.google.com/mail/?view=cm&fs=1&to=${encodeURIComponent(to)}&su=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`,
    outlook:`https://outlook.office.com/mail/deeplink/compose?to=${encodeURIComponent(to)}&subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`};
}
async function rqSubmit(){
  rqCollect(); if(!rqValidate()) return;
  const u=RQ[L], d=rqData[rqKind];
  try{ localStorage.setItem("cia-rq-contact",JSON.stringify({name:d.name,org:d.org,email:d.email,phone:d.phone,country:d.country,city:d.city})); }catch(e){}
  const m=rqCompose(rqRef()); rqLast={...m,kind:rqKind,sent:false};
  if(FORM_ENDPOINT){
    const btn=$("rqSubmit"); btn.disabled=true; btn.textContent=u.sending;
    try{
      const F=RQ_FORMS[rqKind], payload={_subject:m.subject,_cc:RQ_TO.slice(1).join(","),_template:"table",_captcha:"false",reference:m.ref,type:u.subj[rqKind]};
      F.fields.forEach(f=>{ const v=d[f.k]; payload[f.l.en]=Array.isArray(v)?v.map(x=>rqOptLabel(f,x)).join(", "):(f.t==="select"&&v?rqOptLabel(f,v):(v||"")); });
      const r=await fetch(FORM_ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json"},body:JSON.stringify(payload)});
      if(r.ok){ rqLast.sent=true; rqShowDone(rqLast); return; }
    }catch(e){}
  }
  rqShowDone(rqLast);
  const a=$("rqDone").querySelector("[data-mailapp]"); if(a) a.click();
}
function rqShowDone(m){
  const u=RQ[L], box=$("rqDone");
  box.innerHTML=`<div class="rq-done-in"><span class="rq-ok" aria-hidden="true"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m5 12 5 5 9-10"/></svg></span>
   <div><h3>${esc(m.sent?u.sentT:u.doneT)}</h3><p>${esc(m.sent?u.sentP:u.doneP)}</p><p class="rq-ref">${esc(u.ref)}: <b class="ltr">${esc(m.ref)}</b></p>
   ${m.sent?"":`<div class="rq-btns"><a class="btn primary" data-mailapp href="${m.mailto}" target="_blank" rel="noopener">${ICO_M}${esc(u.mailApp)}</a><a class="btn gold" href="${m.gmail}" target="_blank" rel="noopener">${esc(u.gmail)} ${EXT}</a><a class="btn" href="${m.outlook}" target="_blank" rel="noopener">${esc(u.outlook)} ${EXT}</a><button class="btn" type="button" data-copy>${esc(u.copy)}</button></div>`}
   <div class="rq-btns sub"><button class="btn" type="button" data-edit>${esc(u.edit)}</button><button class="btn" type="button" data-new>${esc(u.again)}</button></div>
   <details class="rq-prev"><summary>${esc(m.subject)}</summary><pre>${esc(m.body)}</pre></details></div></div>`;
  box.hidden=false; document.querySelector(".rq-grid").hidden=true;
  const cp=box.querySelector("[data-copy]"); if(cp) cp.onclick=async()=>{ const t=`To: ${RQ_TO.join(", ")}\nSubject: ${m.subject}\n\n${m.body}`; try{ await navigator.clipboard.writeText(t); toast(u.copied);}catch(e){ const r=document.createRange(); r.selectNodeContents(box.querySelector("pre")); const s=getSelection(); s.removeAllRanges(); s.addRange(r);} };
  box.querySelector("[data-edit]").onclick=()=>{ box.hidden=true; document.querySelector(".rq-grid").hidden=false; rqLast=null; };
  box.querySelector("[data-new]").onclick=()=>{ const keep=rqData[rqKind]; rqData[rqKind]={name:keep.name,org:keep.org,email:keep.email,phone:keep.phone,country:keep.country,city:keep.city}; rqLast=null; box.hidden=true; document.querySelector(".rq-grid").hidden=false; renderRequest(); };
  box.scrollIntoView({behavior:"smooth",block:"center"});
}
function rqOpen(kind){ rqCollect(); rqKind=kind; rqLast=null; $("rqDone").hidden=true; document.querySelector(".rq-grid").hidden=false; renderRequest(); $("request").scrollIntoView({behavior:"smooth"}); }
const ICO_C=`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>`;
const ICO_T=`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c3 2.5 9 2.5 12 0v-5"/></svg>`;
const ICO_M=`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>`;

function renderAll(animate){ rqCollect(); renderText(); renderRequest(); renderToolkits(); renderSystems(); renderJourney(); renderIMS(); renderRoad(); renderKnow(); renderOrbit(animate); }

/* events */
$("langBtn").onclick = ()=>{ L = L==="en"?"ar":"en"; try{localStorage.setItem("cia-lang",L);}catch(e){} renderAll(false); };
let toastT; function toast(m){ const t=$("toast"); t.textContent=m; t.classList.add("on"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("on"),1800); }
$("copyBtn").onclick = async ()=>{ try{ await navigator.clipboard.writeText(EMAIL); toast(UI[L].copied); }catch(e){ const r=document.createRange(); r.selectNodeContents($("emailTxt")); const s=getSelection(); s.removeAllRanges(); s.addRange(r); } };
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change",()=>renderOrbit(false));

/* init */
(function(){
  const q = new URLSearchParams(location.search).get("lang");
  let saved = null; try{ saved = localStorage.getItem("cia-lang"); }catch(e){}
  if(q==="ar"||q==="en") L=q; else if(saved==="ar"||saved==="en") L=saved;
  renderAll(true);
})();
</script>
