<style>
:root{
  --bg:#F3F7FB; --surface:#FFFFFF; --ink:#1B2A4A; --ink-soft:#4B5874; --muted:#6F7B93; --line:#DCE4EE;
  --gold:#B8901E; --gold-ink:#7A5E10; --gold-tint:#FBF4DF; --navy:#1B2A4A; --on-navy:#FFFFFF;
  --c-iso:#1E8C93; --c-grc:#7B5BB8; --c-pmo:#3563C9; --c-exc:#B8901E; --c-str:#3C9A5F; --c-aud:#C9821A; --c-ai:#C2410C;
  --live:#2F8A55; --dev:#B7791F; --plan:#7A869E;
  --radius-lg:24px; --radius:14px; --radius-sm:9px;
  --display:"Fraunces",Georgia,serif; --body:"IBM Plex Sans","Segoe UI",Helvetica,Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html[lang="ar"]{--display:"Noto Kufi Arabic","IBM Plex Sans Arabic",Tahoma,sans-serif;--body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1729; --surface:#15213A; --ink:#E7ECF4; --ink-soft:#B6C0D2; --muted:#8C98AE; --line:#2A3A58;
    --gold:#D6B04A; --gold-ink:#E7CB7A; --gold-tint:#2A2717; --navy:#0A1222; --on-navy:#FFFFFF;
    --c-iso:#3DB5BC; --c-grc:#A58BE0; --c-pmo:#6F95EA; --c-exc:#D6B04A; --c-str:#5DBE80; --c-aud:#E3A043; --c-ai:#EC6A3A;
    --live:#5DBE80; --dev:#E3A043; --plan:#8C98AE;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1729; --surface:#15213A; --ink:#E7ECF4; --ink-soft:#B6C0D2; --muted:#8C98AE; --line:#2A3A58;
  --gold:#D6B04A; --gold-ink:#E7CB7A; --gold-tint:#2A2717; --navy:#0A1222; --on-navy:#FFFFFF;
  --c-iso:#3DB5BC; --c-grc:#A58BE0; --c-pmo:#6F95EA; --c-exc:#D6B04A; --c-str:#5DBE80; --c-aud:#E3A043; --c-ai:#EC6A3A;
  --live:#5DBE80; --dev:#E3A043; --plan:#8C98AE;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 76px)}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased}
html[lang="ar"] body{font-size:16.5px;line-height:1.85}
img,svg{max-width:100%}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:6px}
.wrap{max-width:1180px;margin-inline:auto;padding-inline:22px}
.ltr{direction:ltr;unicode-bidi:isolate}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;justify-content:space-between;gap:14px;height:64px}
.brand{display:flex;align-items:center;gap:11px;text-decoration:none;min-width:0;flex:none}
.brand img{width:40px;height:40px;border-radius:50%;flex:none;background:#fff}
.brand b{font-family:var(--display);font-size:15px;line-height:1.25;display:block;white-space:nowrap}
.brand span{font-size:12.5px;color:var(--muted);display:block;white-space:nowrap}
.nav{display:flex;gap:2px}
.nav a{color:var(--ink-soft);text-decoration:none;font-size:14px;padding:7px 12px;border-radius:999px;white-space:nowrap}
.nav a:hover{background:var(--bg);color:var(--ink)}
.bar-right{display:flex;align-items:center;gap:8px;min-width:0;flex:1 1 auto;justify-content:flex-end}
.nav{min-width:0;overflow-x:auto;scrollbar-width:none;-webkit-mask-image:linear-gradient(to var(--fade-dir,right),#000 calc(100% - 22px),transparent);mask-image:linear-gradient(to var(--fade-dir,right),#000 calc(100% - 22px),transparent)}
.nav::-webkit-scrollbar{display:none}
html[dir="rtl"] .nav{--fade-dir:left}
.trainBtn,.lang{flex:none}
.lang{display:inline-flex;align-items:center;gap:8px;border:0;background:var(--navy);color:var(--on-navy);border-radius:999px;padding:8px 15px;font-size:14px;font-weight:600;cursor:pointer}
.lang:hover{filter:brightness(1.18)}
@media (max-width:1020px){.nav{display:none}}
@media (max-width:1300px){.nav a{padding:7px 10px}}
@media (max-width:460px){.brand span{display:none}.brand b{font-size:14px}}

/* hero */
.hero{padding-block:46px 30px}
.hero-grid{display:grid;grid-template-columns:1.05fr 1fr;gap:34px;align-items:center}
.hero-grid>*{min-width:0}
@media (max-width:900px){.hero-grid{grid-template-columns:1fr}}
.kicker{display:inline-flex;align-items:center;gap:9px;background:var(--gold-tint);color:var(--gold-ink);border:1px solid color-mix(in srgb,var(--gold) 35%,transparent);padding:6px 14px;border-radius:999px;font-size:14px;font-weight:600}
.kicker i{width:8px;height:8px;border-radius:50%;background:var(--live);box-shadow:0 0 0 4px color-mix(in srgb,var(--live) 22%,transparent)}
.hero h1{font-family:var(--display);font-weight:700;font-size:clamp(34px,5.4vw,62px);line-height:1.08;letter-spacing:-.02em;margin:18px 0 16px}
html[lang="ar"] .hero h1{font-weight:800;letter-spacing:0;line-height:1.35;font-size:clamp(30px,4.6vw,54px)}
.hero .lede{font-size:18px;color:var(--ink-soft);max-width:54ch;margin:0}
.cta-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}
.btn{display:inline-flex;align-items:center;gap:9px;border-radius:12px;padding:12px 18px;font-weight:600;font-size:15px;text-decoration:none;cursor:pointer;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
.btn:hover{border-color:var(--ink-soft)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
.btn.primary:hover{filter:brightness(1.18)}
.btn svg{flex:none}
html[dir="rtl"] .flip{transform:scaleX(-1)}
.facts{display:flex;flex-wrap:wrap;gap:22px;margin-top:30px;padding-top:20px;border-top:1px solid var(--line)}
.fact b{font-family:var(--display);font-size:26px;display:block;line-height:1.1}
.fact span{font-size:13.5px;color:var(--muted)}
.author{display:flex;align-items:center;gap:10px;margin-top:22px;font-size:14.5px;color:var(--muted)}
.author strong{color:var(--ink);font-family:var(--display);font-size:17px}


/* sections */
section{padding:50px 0}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;flex-wrap:wrap;margin-bottom:24px}
.sec-head h2{font-family:var(--display);font-size:clamp(26px,3.2vw,36px);line-height:1.2;margin:0}
html[lang="ar"] .sec-head h2{line-height:1.5}
.sec-head p{margin:8px 0 0;color:var(--ink-soft);max-width:62ch}
.band{background:var(--surface);border-block:1px solid var(--line)}

/* live toolkits */
.tk-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media (max-width:1200px){.tk-grid{grid-template-columns:repeat(3,1fr)}}@media (max-width:860px){.tk-grid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:560px){.tk-grid{grid-template-columns:1fr}}
.tk{--c:var(--c-iso);position:relative;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px 20px 20px;overflow:hidden}
.tk::before{content:"";position:absolute;inset-inline:0;top:0;height:5px;background:var(--c)}
.tk .code{font-family:Georgia,"Times New Roman",serif;font-weight:700;font-size:40px;line-height:1;letter-spacing:-1px;direction:ltr;text-align:start;color:var(--ink)}
html[dir="rtl"] .tk .code{text-align:right}
.tk .code small{display:block;font-size:14px;letter-spacing:0;font-weight:400;color:var(--c);margin-top:8px;font-family:var(--body)}
.tk .code .pre{font-size:15px;letter-spacing:.5px;font-weight:600;color:var(--muted);display:block;margin-bottom:4px}
.tk h3{font-family:var(--display);font-size:17px;line-height:1.4;margin:14px 0 10px}
.tk ul{list-style:none;padding:0;margin:0 0 18px;display:grid;gap:6px;font-size:14px;color:var(--ink-soft)}
.tk li{display:flex;gap:8px;align-items:flex-start}
.tk li::before{content:"";width:6px;height:6px;border-radius:2px;background:var(--c);flex:none;margin-top:.7em}
.tk .btn{margin-top:auto;justify-content:center;background:color-mix(in srgb,var(--c) 10%,var(--surface));border-color:color-mix(in srgb,var(--c) 45%,transparent);color:var(--ink)}
.tk .btn:hover{background:var(--c);border-color:var(--c);color:#fff}
.tk .live-tag{position:absolute;top:16px;inset-inline-end:16px;font-size:12px;font-weight:600;color:var(--live);display:flex;align-items:center;gap:6px}
.tk .live-tag i{width:7px;height:7px;border-radius:50%;background:var(--live)}

/* systems */
.filters{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.dot.live{background:var(--live)} .dot.dev{background:var(--dev)} .dot.plan{background:transparent;border:1.5px solid var(--plan)}
.sys-list{display:grid;gap:12px}
.sys{--c:var(--c-iso);display:grid;grid-template-columns:260px 1fr;gap:22px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px 22px;border-inline-start:6px solid var(--c);transition:box-shadow .3s,border-color .3s}
.sys.flash{box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 30%,transparent)}
@media (max-width:820px){.sys{grid-template-columns:1fr;gap:12px}}
.sys h3{font-family:var(--display);font-size:19px;line-height:1.35;margin:0 0 6px}
.sys .sys-sub{font-size:14px;color:var(--ink-soft);margin:0}
.sys .notify{display:inline-flex;align-items:center;gap:6px;margin-top:12px;font-size:13.5px;font-weight:600;color:var(--c);text-decoration:none}
.sys .notify:hover{text-decoration:underline}
.mods{display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start}
.mod{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14px;background:var(--bg);text-decoration:none;color:var(--ink);transition:opacity .2s}
.mod small{color:var(--muted);font-size:12.5px}
a.mod{border-color:color-mix(in srgb,var(--live) 45%,transparent);background:color-mix(in srgb,var(--live) 9%,var(--surface));font-weight:600}
a.mod:hover{border-color:var(--live)}
.mod.dim{opacity:.28}
.legend{display:flex;flex-wrap:wrap;gap:16px;font-size:13.5px;color:var(--muted);margin-top:16px}
.legend span{display:inline-flex;align-items:center;gap:7px}

/* journey */
.journey{display:grid;grid-template-columns:repeat(6,1fr);gap:0;counter-reset:st;position:relative}
@media (max-width:900px){.journey{grid-template-columns:repeat(3,1fr);row-gap:22px}}
@media (max-width:520px){.journey{grid-template-columns:repeat(2,1fr)}}
.st{position:relative;padding-inline-end:14px}
.st .n{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-family:Georgia,serif;font-weight:700;background:var(--surface);border:2px solid var(--gold);color:var(--ink);position:relative;z-index:1}
.st:last-child .n{background:var(--gold);color:#fff}
.st::after{content:"";position:absolute;top:19px;inset-inline-start:38px;inset-inline-end:0;height:2px;background:var(--line)}
.st:last-child::after{display:none}
@media (max-width:900px){.st:nth-child(3n)::after{display:none}}
@media (max-width:520px){.st::after{display:none}}
.st b{display:block;font-family:var(--display);font-size:16.5px;margin-top:12px;line-height:1.35}
.st span{font-size:13.5px;color:var(--ink-soft);display:block;margin-top:4px;line-height:1.55}
.loop-note{margin-top:22px;font-size:14px;color:var(--muted);display:flex;align-items:center;gap:8px}
.inside{margin-top:40px;background:var(--bg);border:1px solid var(--line);border-radius:20px;padding:22px}
.inside h3{font-family:var(--display);font-size:19px;margin:0 0 4px}
.inside p{margin:0 0 16px;color:var(--ink-soft);font-size:14.5px}
.tabs-demo{display:flex;flex-wrap:wrap;gap:8px}
.tabs-demo span{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14px}
.tabs-demo span i{font-style:normal;font-family:Georgia,serif;font-weight:700;color:var(--gold);font-size:13px}

/* IMS matrix */
.table-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:18px;background:var(--surface)}
table{width:100%;border-collapse:collapse;min-width:1060px;font-size:14.5px}
th,td{padding:11px 14px;text-align:start;border-bottom:1px solid var(--line);vertical-align:top}
thead th{background:color-mix(in srgb,var(--navy) 6%,var(--surface));font-size:13.5px;color:var(--ink-soft);font-weight:600;position:sticky;top:0}
thead th.std{text-align:center;direction:ltr;width:140px}
td.proc{min-width:210px;font-weight:500}
td.chk{text-align:center;color:var(--live);font-weight:700}
td.cl{direction:ltr;text-align:start;color:var(--muted);font-family:Georgia,serif;white-space:nowrap}
html[dir="rtl"] td.cl{text-align:right}
td.out{color:var(--ink-soft);min-width:210px}
tr.grp th{background:var(--gold-tint);color:var(--gold-ink);font-size:13.5px}
td.spec{font-size:13.5px;color:var(--ink-soft);text-align:start}
tbody tr:last-child td{border-bottom:0}
.ims-foot{display:flex;gap:14px;align-items:flex-start;margin-top:18px;background:var(--gold-tint);border:1px solid color-mix(in srgb,var(--gold) 35%,transparent);border-radius:14px;padding:14px 16px;font-size:14.5px;color:var(--gold-ink)}

/* roadmap */
.road{position:relative;display:grid;gap:0}
.wave{display:grid;grid-template-columns:64px 1fr;gap:16px;position:relative;padding-bottom:22px}
.wave::before{content:"";position:absolute;top:44px;bottom:0;inset-inline-start:31px;width:2px;background:var(--line)}
.wave:last-child::before{display:none}
.wave .wn{width:64px;height:44px;border-radius:12px;display:grid;place-items:center;font-family:Georgia,serif;font-weight:700;font-size:15px;border:1.5px solid var(--line);background:var(--surface);color:var(--muted);position:relative;z-index:1}
.wave.done .wn{background:var(--live);border-color:var(--live);color:#fff}
.wave.dev .wn{border-color:var(--dev);color:var(--dev);background:color-mix(in srgb,var(--dev) 10%,var(--surface))}
.wave .wb{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px}
.wave.done .wb{border-color:color-mix(in srgb,var(--live) 40%,transparent)}
.wave.dev .wb{border-color:color-mix(in srgb,var(--dev) 50%,transparent)}
.wave .wt{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.wave h3{font-family:var(--display);font-size:17px;margin:0;line-height:1.4}
.wave p{margin:4px 0 0;font-size:14px;color:var(--ink-soft)}
.st-tag{font-size:12.5px;font-weight:600;border-radius:999px;padding:3px 10px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.st-tag.live{background:color-mix(in srgb,var(--live) 14%,var(--surface));color:var(--live)}
.st-tag.dev{background:color-mix(in srgb,var(--dev) 14%,var(--surface));color:var(--dev)}
.st-tag.plan{background:var(--bg);color:var(--muted)}
.milestone{margin:4px 0 26px;margin-inline-start:80px;border:1.5px dashed var(--gold);border-radius:14px;padding:12px 16px;font-size:14px;color:var(--gold-ink);background:var(--gold-tint)}
@media (max-width:560px){.wave{grid-template-columns:52px 1fr;gap:12px}.wave .wn{width:52px;font-size:13px}.wave::before{inset-inline-start:25px}.milestone{margin-inline-start:0}}

/* knowledge */
.kpath{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;counter-reset:k}
@media (max-width:900px){.kpath{grid-template-columns:repeat(2,1fr)}}
@media (max-width:560px){.kpath{grid-template-columns:1fr}}
details.k{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0}
details.k summary{list-style:none;cursor:pointer;padding:15px 16px;display:flex;align-items:center;gap:12px;font-family:var(--display);font-size:16.5px;font-weight:600}
details.k summary::-webkit-details-marker{display:none}
details.k summary .kn{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-family:Georgia,serif;font-size:13px;font-weight:700;background:var(--gold-tint);color:var(--gold-ink);flex:none}
details.k summary .chev{margin-inline-start:auto;transition:transform .2s;color:var(--muted);flex:none}
details.k[open] summary .chev{transform:rotate(180deg)}
details.k .kb{padding:0 16px 16px;font-size:14.5px;color:var(--ink-soft)}
details.k .kb p{margin:0}
details.k .kb .rel{margin-top:10px;font-size:13px;color:var(--muted)}

/* about */
.about{display:grid;grid-template-columns:180px 1fr;gap:30px;align-items:center;background:var(--navy);color:#E9EEF7;border-radius:var(--radius-lg);padding:30px}
@media (max-width:700px){.about{grid-template-columns:1fr;text-align:center}.about img{margin-inline:auto}}
.about img{width:180px;height:180px;border-radius:50%;background:#fff;display:block}
.about h2{font-family:var(--display);font-size:clamp(24px,3vw,32px);margin:0 0 6px;color:#fff}
.about .role{color:#E2C46B;font-weight:600;margin:0 0 12px}
.about p{margin:0 0 10px;color:#C9D3E4;max-width:66ch}
@media (max-width:700px){.about p{margin-inline:auto}}
.contact{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
@media (max-width:700px){.contact{justify-content:center}}
.contact .btn{background:transparent;border-color:rgba(255,255,255,.3);color:#fff}
.contact .btn:hover{border-color:#fff}
.contact .btn.gold{background:#D6B04A;border-color:#D6B04A;color:#1B2A4A}

footer{padding:34px 0 40px;font-size:13px;color:var(--muted)}
footer .wrap{display:grid;gap:8px}
footer strong{color:var(--ink)}

  .topbar,.mNav,.modOverlay,.toast,.tour{display:none!important}
  html.pdash body{background:#fff}
  html.pdash main>*:not(#dash),html.pdash footer{display:none!important}
  html.pdash #dash{padding:0}

  html.pdash .print-head span{display:block;font-size:11.5px;color:#4B5874}

  html.pdash .cockpit{grid-template-columns:250px minmax(0,1fr)!important;padding:14px;gap:14px}

  html.pdash .ck-side{gap:10px}
  html.pdash .ck-stats{gap:6px}
  html.pdash .cs{padding:7px 9px;border-radius:10px}

  html.pdash .ck-rank h3{font-size:12.5px;margin-bottom:4px}
  html.pdash .rk{gap:0}

  html.pdash .ck-banner{padding:6px 10px;font-size:11px}

  html.pdash .dc-code{font-size:15px}
  html.pdash .dc h3{font-size:11.5px;margin:2px 0 6px;line-height:1.3}
  html.pdash .dc-main{margin-bottom:6px;gap:6px}
  html.pdash .dc-idx{font-size:21px}
  html.pdash .dc-band{font-size:9.5px;padding:2px 6px}

}

/* ===================== TOOL WHEEL (home) =====================
   Seven segments, one per system, around the organization in the centre — the same idea as the
   PDCA clause wheel inside the tools. Point at a segment to preview it; select it to open its drawer. */
const WG = {C:380, r0:126, r1:284, b0:292, b1:332};
let wLast = null, wHotI = null, wFirst = true, wBig = null;
const orbReduced = ()=>matchMedia("(prefers-reduced-motion:reduce)").matches;
const sysTools = id => TOOLKITS.filter(t=>TK_SYS[t.k]===id);
function wStats(){
  const R = (typeof DEMO!=="undefined" && DEMO) ? CIADASH.evalAll() : DR;   /* the wheel always shows your own data */
  const ok = k => R[k] && R[k].st==="ok";
  const per = SYSTEMS.map(s=>{ const tools = sysTools(s.id);
    return {n:tools.length, tools, started:tools.filter(t=>ok(t.k)).length, idx:dMean(tools.filter(t=>ok(t.k)&&R[t.k].idx!=null).map(t=>R[t.k].idx))}; });
  const inIdx = CIADASH.TOOLS.filter(t=>isSel(t.k) && ok(t.k) && R[t.k].idx!=null);
  return {R, per, overall:dMean(inIdx.map(t=>R[t.k].idx)), on:inIdx.length};
}
function wPath(a0,a1,ri,ro){
  const C = WG.C, p = (a,r)=>[(C+r*Math.cos(a)).toFixed(2),(C+r*Math.sin(a)).toFixed(2)];
  const [x0,y0]=p(a0,ro),[x1,y1]=p(a1,ro),[x2,y2]=p(a1,ri),[x3,y3]=p(a0,ri), lg=(a1-a0)>Math.PI?1:0;
  return `M${x0} ${y0}A${ro} ${ro} 0 ${lg} 1 ${x1} ${y1}L${x2} ${y2}A${ri} ${ri} 0 ${lg} 0 ${x3} ${y3}Z`;
}
const wScore = v => v==null ? "" : Math.round(v)+"%";
function wCenterDef(W){
  const u = UI[L], C = WG.C, logo = esc((document.querySelector(".brand img")||{}).src||"");
  const lg = (cy,r)=>`<clipPath id="wcClip"><circle cx="${C}" cy="${cy}" r="${r}"/></clipPath><circle cx="${C}" cy="${cy}" r="${r+2}" fill="#fff"/>${logo?`<image href="${logo}" x="${C-r}" y="${cy-r}" width="${2*r}" height="${2*r}" clip-path="url(#wcClip)"/>`:""}`;
  if(W.overall!=null) return lg(C-62,20) +
    `<text x="${C}" y="${C-20}" text-anchor="middle" font-size="13" font-weight="600" fill="#E2C46B">${esc(u.wOverall)}</text>
     <text x="${C}" y="${C+26}" text-anchor="middle" font-size="46" font-weight="700" fill="#fff" style="font-family:Fraunces,Georgia,serif;direction:ltr">${wScore(W.overall)}</text>
     <text x="${C}" y="${C+52}" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">${esc(u.wOrg)}</text>
     <text x="${C}" y="${C+74}" text-anchor="middle" font-size="12.5" fill="#E2C46B">${esc(u.wDash)}</text>`;
  return lg(C-30,32) +
    `<text x="${C}" y="${C+32}" text-anchor="middle" font-size="${u.wOrg.length>10?18:22}" font-weight="700" fill="#fff">${esc(u.wOrg)}</text>
     <text x="${C}" y="${C+58}" text-anchor="middle" font-size="12.5" fill="#E2C46B">${esc(u.wDash)}</text>`;
}
function wCenterHov(i, W){
  const u = UI[L], s = SYSTEMS[i], st = W.per[i], C = WG.C, lines = s.short[L], sc = wScore(st.idx);
  const y0 = C - (sc?44:30) - (lines.length-1)*12;
  let out = `<text x="${C}" y="${y0}" text-anchor="middle" font-size="13" font-weight="600" fill="#E2C46B">${esc(u.tkCount(st.n))}</text>`;
  lines.forEach((t,j)=>{ out += `<text x="${C}" y="${y0+30+j*25}" text-anchor="middle" font-size="21" font-weight="700" fill="#fff">${esc(t)}</text>`; });
  const yb = y0 + 30 + (lines.length-1)*25;
  out += sc ? `<text x="${C}" y="${yb+44}" text-anchor="middle" font-size="32" font-weight="700" fill="#fff" style="font-family:Fraunces,Georgia,serif;direction:ltr">${sc}</text>`
            : `<text x="${C}" y="${yb+30}" text-anchor="middle" font-size="12.5" fill="#AEBAD0">${esc(u.wNone)}</text>`;
  return out;
}
function renderWheel(){
  const svg = $("wheel"); if(!svg) return;
  const u = UI[L], W = wLast = wStats(), N = SYSTEMS.length, step = 2*Math.PI/N, dir = L==="ar" ? -1 : 1, C = WG.C;
  wBig = innerWidth < 600; const fz = wBig ? 1.3 : 1;          /* larger labels when the wheel is drawn small */
  const p = (a,r)=>[C+r*Math.cos(a), C+r*Math.sin(a)];
  let g = `<circle class="w-loop" cx="${C}" cy="${C}" r="352"/>`;
  SYSTEMS.forEach((s,i)=>{
    const st = W.per[i], mid = -Math.PI/2 + dir*i*step, a0 = mid-step/2, a1 = mid+step/2, sc = wScore(st.idx);
    const [tx,ty] = p(mid, 206), [bx,by] = p(mid, (WG.b0+WG.b1)/2), lines = s.short[L];
    const nH = 32*fz, lH = 23*fz, H = nH + 12 + lH*lines.length, top = ty - H/2;
    g += `<g class="wseg" tabindex="0" role="button" data-i="${i}" style="--c:var(${s.color});animation-delay:${60+i*70}ms" aria-label="${esc(u.wSegAria(s.name[L], u.tkCount(st.n), sc))}">
      <path class="sh" d="${wPath(a0+.017, a1-.017, WG.r0, WG.r1)}"/>
      <path class="bd" d="${wPath(a0+.013, a1-.013, WG.b0, WG.b1)}"/>
      <text class="num" x="${tx.toFixed(1)}" y="${(top+nH).toFixed(1)}" text-anchor="middle" font-size="${(44*fz).toFixed(1)}" style="fill:var(--c)">${st.n}</text>
      ${lines.map((t,j)=>`<text x="${tx.toFixed(1)}" y="${(top+nH+12+17*fz+j*lH).toFixed(1)}" text-anchor="middle" font-size="${(19*fz).toFixed(1)}" font-weight="700" style="fill:var(--ink)">${esc(t)}</text>`).join("")}
      ${sc?`<text x="${bx.toFixed(1)}" y="${(by+6).toFixed(1)}" text-anchor="middle" font-size="${(16*Math.min(fz,1.15)).toFixed(1)}" font-weight="700" fill="#fff" style="direction:ltr">${sc}</text>`:""}
    </g>`;
  });
  g += `<g class="wctr" id="wCtr" tabindex="0" role="button" aria-label="${esc(u.wCtrAria)}">
    <circle class="disc" cx="${C}" cy="${C}" r="112" style="fill:var(--navy)"/>
    <circle class="ring" cx="${C}" cy="${C}" r="112" fill="none" style="stroke:var(--gold)" stroke-width="3"/>
    <circle cx="${C}" cy="${C}" r="100" fill="none" style="stroke:var(--gold)" stroke-opacity=".35" stroke-width="1"/>
    <g id="wcDef">${wCenterDef(W)}</g><g id="wcHov" style="display:none"></g></g>`;
  svg.innerHTML = g;
  svg.classList.toggle("wheel-in", wFirst && !orbReduced()); wFirst = false; wHotI = null; svg.classList.remove("dim");
  const bind = (el,i)=>{
    el.addEventListener("mouseenter",()=>wHover(i)); el.addEventListener("mouseleave",()=>wHover(null));
    el.addEventListener("focus",()=>wHover(i)); el.addEventListener("blur",()=>wHover(null));
    el.addEventListener("click",()=>sdOpen(i));
    el.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); sdOpen(i); } });
  };
  svg.querySelectorAll(".wseg").forEach(el=>bind(el, +el.dataset.i));
  const ctr = $("wCtr"); ctr.onclick = ()=>route("#dash");
  ctr.onkeydown = e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); route("#dash"); } };
  /* legend: readable on small screens, and a second way to pick a system */
  const leg = $("wheelLeg"); leg.setAttribute("aria-label", u.wTitle);
  leg.innerHTML = SYSTEMS.map((s,i)=>{ const st = W.per[i], sc = wScore(st.idx);
    return `<button type="button" class="wl" data-i="${i}" style="--c:var(${s.color})"><i></i><b>${esc(s.short[L].join(" "))}</b><span>${esc(u.tkCount(st.n))}</span>${sc?`<em>${sc}</em>`:""}</button>`; }).join("");
  leg.querySelectorAll(".wl").forEach(el=>bind(el, +el.dataset.i));
  if(sdI>=0) sdRender();
}
function wHover(i){
  const svg = $("wheel"); if(!svg || !wLast) return; wHotI = i;
  svg.classList.toggle("dim", i!=null);
  svg.querySelectorAll(".wseg").forEach(g=>g.classList.toggle("hot", i!=null && +g.dataset.i===i));
  document.querySelectorAll("#wheelLeg .wl").forEach(b=>b.classList.toggle("hot", i!=null && +b.dataset.i===i));
  const d = $("wcDef"), h = $("wcHov"); if(!d || !h) return;
  if(i==null){ h.style.display = "none"; d.style.display = ""; }
  else { h.innerHTML = wCenterHov(i, wLast); h.style.display = ""; d.style.display = "none"; }
}
window.addEventListener("resize", ()=>{ if(wBig!=null && (innerWidth<600)!==wBig) renderWheel(); });

/* ----- system drawer: the tools of one system, with your score in each ----- */
let sdI = -1, sdRet = null;
function sdOpen(i){
  const N = SYSTEMS.length, was = sdI>=0, d = $("sd");
  sdI = ((i % N) + N) % N; sdRender();
  if(!was){
    sdRet = document.activeElement;
    d.classList.add("on"); $("sdBg").classList.add("on"); document.documentElement.classList.add("drw-on"); d.setAttribute("aria-hidden","false");
    setTimeout(()=>{ const x = $("sdX"); if(x) x.focus({preventScroll:true}); }, 80);
  }
}
function sdClose(){
  const d = $("sd"); if(sdI<0) return; sdI = -1;
  d.classList.remove("on"); $("sdBg").classList.remove("on"); document.documentElement.classList.remove("drw-on"); d.setAttribute("aria-hidden","true");
  wHover(null);
  if(sdRet && document.contains(sdRet) && sdRet.focus) sdRet.focus({preventScroll:true});
}
function sdRender(){
  const d = $("sd"); if(!d || sdI<0) return;
  const u = UI[L], t = u.sd, du = dU(), W = wLast || wStats(), s = SYSTEMS[sdI], st = W.per[sdI], N = SYSTEMS.length;
  const prev = SYSTEMS[(sdI-1+N)%N], next = SYSTEMS[(sdI+1)%N];
  d.style.setProperty("--c", `var(${s.color})`);
  const card = tk => {
    const r = W.R[tk.k], started = !!(r && r.st==="ok"), has = started && r.idx!=null, b = has ? dBand(r.idx) : -1, bc = b>=0 ? `var(${BANDV[b]})` : "";
    const feats = tk.feat ? tk.feat[L].slice(0,3) : [tk.extra ? tk.extra[L] : null, ...u.tkFeat.slice(0,2)].filter(Boolean);
    const score = has
      ? `<b style="color:${bc}">${Math.round(r.idx)}%</b><span class="bdg" style="color:${bc};background:color-mix(in srgb,${bc} 13%,transparent)">${esc(du.bands[b])}</span><span class="bar"><i style="width:${Math.max(2,Math.min(100,r.idx)).toFixed(1)}%;background:${bc}"></i></span>${r.comp!=null?`<small>${esc(t.comp)} ${Math.round(r.comp)}%</small>`:""}`
      : `<span class="ns">${esc(t.ns)}</span>`;
    return `<article class="dt" style="--c:var(${s.color})">
      <div class="dt-h"><div><div class="dt-code"><span class="pre">${esc(tk.pre)}</span>${esc(tk.code)}</div><h3>${esc(tk.title[L])}</h3><span class="ed">${esc(tk.ed[L])}</span></div><div class="dt-sc">${score}</div></div>
      <ul>${feats.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
      <div class="dt-f"><a class="btn" href="${URLS[tk.k]}" data-mod="${tk.k}" data-modname="${esc(tk.title[L])}">${esc(t.open)} ${EXT}</a>${started?`<button type="button" class="btn" data-d="${tk.k}">${esc(t.details)}</button>`:""}</div>
    </article>`;
  };
  d.innerHTML = `<div class="sd-h"><span class="sd-n">${st.n}</span><div class="sd-t"><small>${esc(t.of(sdI+1,N))}</small><h2 id="sdT">${esc(s.name[L])}</h2></div><button type="button" class="sd-lang" id="sdLang" aria-label="${esc(L==="ar"?"Switch to English":"التبديل إلى العربية")}">${ICO_LANG}<span>${esc(u.lang)}</span></button><button type="button" class="sd-x" id="sdX" aria-label="${esc(t.close)}">×</button></div>
    <div class="sd-b"><p class="sd-intro">${esc(s.sub[L])}</p>
      <div class="sd-stats"><div class="sd-stat"><span>${esc(t.tools)}</span><b>${st.n}</b></div><div class="sd-stat"><span>${esc(t.started)}</span><b>${st.started} / ${st.n}</b></div><div class="sd-stat"><span>${esc(t.idx)}</span><b>${st.idx==null ? "—" : wScore(st.idx)}</b></div></div>
      <h3 class="sd-lt">${esc(t.listT)}</h3>
      <div class="sd-list">${st.tools.map(card).join("")}</div></div>
    <div class="sd-f"><button type="button" data-go="-1">${esc(t.prev)}: ${esc(prev.short[L].join(" "))}</button><button type="button" data-go="1">${esc(t.next)}: ${esc(next.short[L].join(" "))}</button></div>`;
  $("sdX").onclick = sdClose; $("sdLang").onclick = ()=>{ $("langBtn").click(); setTimeout(()=>{ const x=$("sdLang"); if(x) x.focus({preventScroll:true}); }, 30); };
  d.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{ sdOpen(sdI + (+b.dataset.go)); const bd = d.querySelector(".sd-b"); if(bd) bd.scrollTop = 0; });
  d.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{ if(DEMO){ DEMO = false; renderDash(); } dOpen(b.dataset.d); });
}

   The home page shows the wheel and the brief only; each menu item opens its own section. */
let curView = "home", lastHash = "#home";
const VIEW_ALIAS = {"":"home", top:"home", home:"home"};
function viewOf(el){ const v = el && el.closest && el.closest("main [data-view]"); return v ? v.dataset.view : null; }
function markNav(){
  document.querySelectorAll("#nav a, #mNav a").forEach(a=>{ const h = (a.getAttribute("href")||"").slice(1);
    if((VIEW_ALIAS[h]||h)===curView) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); });
}
function showView(v){
  if(!document.querySelector(`main [data-view="${v}"]`)) v = "home";
  if(v!==curView && sdI>=0) sdClose();
  curView = v;
  document.querySelectorAll("main [data-view]").forEach(e=>{ e.hidden = e.dataset.view!==v; });
  document.documentElement.dataset.view = v;
  markNav();
}
function route(hash, push, keep){
  hash = String(hash||"").replace(/^#/,"");
  if(/^m=/.test(hash)) return;
  let target = null, v = VIEW_ALIAS[hash];
  if(!v){ target = document.getElementById(hash); v = viewOf(target); if(!v){ v = "home"; target = null; } }
  const changed = v!==curView; showView(v); closeMenu();
  if(push!==false) navPush({v}, "#"+(target ? hash : "home"));
  if(keep && !changed) return;
  const first = target && target === document.querySelector(`main [data-view="${v}"]`);
  const how = (changed || orbReduced()) ? "instant" : "smooth";
  if(!target || first) window.scrollTo({top:0, behavior:how});
  else requestAnimationFrame(()=>target.scrollIntoView({behavior:how, block:"start"}));
}
document.addEventListener("click", e=>{
  if(e.defaultPrevented || e.button!==0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
  const a = e.target.closest('a[href^="#"]'); if(!a || a.hasAttribute("data-mod")) return;
  const h = a.getAttribute("href"); if(h==="#" || /^#m=/.test(h)) return;
  e.preventDefault(); route(h);
});

function renderRequest(){
  const u=RQ[L], box=$("rqForm"); if(!box) return;
  $("qTitle").textContent=u.title; $("qSub").textContent=u.sub;
  $("rqSwitch").innerHTML=["consult","training"].map(k=>`<button type="button" role="tab" aria-selected="${rqKind===k}" data-k="${k}">${k==="consult"?ICO_C:ICO_T}<span>${esc(u.tabs[k])}</span></button>`).join("");
  $("rqSwitch").querySelectorAll("button").forEach(b=>b.onclick=()=>{rqCollect(); rqKind=b.dataset.k; rqLast=null; $("rqDone").hidden=true; document.querySelector(".rq-grid").hidden=false; renderRequest();});
  const F=RQ_FORMS[rqKind], d=rqData[rqKind];
  const lab=f=>`${esc(f.l[L])}${f.req?` <b class="rq-star" aria-hidden="true">*</b>`:""}`;
  let h=`<div class="rq-err-top" id="rqErrTop" role="alert" hidden></div><div class="rq-fields">`;
  F.fields.forEach(f=>{ const id="rq-"+rqKind+"-"+f.k, v=d[f.k];
    const cls=`rq-f${f.full||f.t==="textarea"?" full":""}`;
    if(f.t==="chips"){ const sel=Array.isArray(v)?v:[];
      h+=`<fieldset class="${cls}" data-f="${f.k}"><legend>${lab(f)}</legend><div class="rq-chips">${f.opts.map(o=>`<button type="button" class="rq-chip" aria-pressed="${sel.includes(o[0])}" data-v="${esc(o[0])}">${esc(o[1][L])}</button>`).join("")}</div><small class="rq-msg"></small></fieldset>`; return; }
    h+=`<label class="${cls}" data-f="${f.k}"><span>${lab(f)}</span>`;
    if(f.t==="select") h+=`<select id="${id}" name="${f.k}" ${f.req?"required":""}><option value="">—</option>${f.opts.map(o=>`<option value="${esc(o[0])}" ${v===o[0]?"selected":""}>${esc(o[1][L])}</option>`).join("")}</select>`;
    else if(f.t==="textarea") h+=`<textarea id="${id}" name="${f.k}" rows="4" ${f.req?"required":""} placeholder="${esc(f.ph?f.ph[L]:"")}">${esc(v||"")}</textarea>`;

/* Can the tool files be reached from where this page was opened? (missing when index.html is opened
   from inside the zip, or previewed on its own without the modules folder) */
const MODCHK = {};
const zipTemp = () => location.protocol==="file:" && /(\.zip[\/\\]|Temp\d+_|Rar\$|7zO)/i.test(decodeURIComponent(location.pathname));
function modReach(url){
  if(MODCHK[url]!=null) return Promise.resolve(MODCHK[url]);
  const p = location.protocol;
  if(p!=="http:" && p!=="https:" && p!=="file:") return Promise.resolve(MODCHK[url]=false);
  if(p==="file:"){
    if(zipTemp()) return Promise.resolve(MODCHK[url]=false);
    /* local files: a prefetch request tells whether the tool file exists, without running it */
    return new Promise(res=>{ const ln=document.createElement("link"); let done=false;
      const fin=v=>{ if(done) return; done=true; ln.remove(); res(MODCHK[url]=v); };
      ln.rel="prefetch"; ln.onload=()=>fin(true); ln.onerror=()=>fin(false); setTimeout(()=>fin(true),4000);
      ln.href=url; document.head.appendChild(ln); });
  }
  return fetch(url,{method:"HEAD",cache:"no-store"}).then(r=>MODCHK[url]=r.ok).catch(()=>true);
}

      ["عرض مثال","يعرض أرقاماً من الأمثلة التطبيقية لترى اللوحة مكتملة، ولا يغيّر بياناتك."]],
    printedOn:"تاريخ الطباعة",
    snapOk:"تم حفظ اللقطة", snapNo:"اللقطات متوقفة أثناء عرض الأرقام التوضيحية", refreshed:"تم تحديث الأرقام", snapsCleared:"تم مسح اللقطات",

let DS = {sel:{}, snaps:[], flt:"all"}, DR = {}, DEMO = false, dashDirty = false, dashGrown = false, dashHover = null;
try{ const raw = localStorage.getItem(DSTORE); if(raw){ const p = JSON.parse(raw); DS = {sel:p.sel||{}, snaps:Array.isArray(p.snaps)?p.snaps:[], flt:p.flt||"all"}; } }catch(e){}
function dSave(){ try{ localStorage.setItem(DSTORE, JSON.stringify(DS)); }catch(e){} }
const dU = () => DUI[L];
const dMean = a => { a = a.filter(x=>x!=null&&isFinite(x)); return a.length ? a.reduce((s,x)=>s+x,0)/a.length : null; };
const dR = v => v==null ? "—" : Math.round(v)+"%";
const dBand = v => v==null ? -1 : v<50 ? 0 : v<70 ? 1 : v<85 ? 2 : 3;
const BANDV = ["--bd-low","--bd-fair","--bd-good","--bd-top"];
const BANDB = ["#EC6A3A","#E3A043","#3DB5BC","#5DBE80"];
const dSys = k => SYSTEMS.find(s=>s.id===k);
const dTool = k => CIADASH.TOOLS.find(t=>t.k===k);
const isSel = k => DS.sel[k] !== false;
function demoSnaps(){ const o = dOverall().idx||60, d = new Date(); const back = (m)=>{ const x=new Date(d); x.setMonth(x.getMonth()-m); return x.toISOString().slice(0,10); };
  return [[9,-11.2],[6,-7.4],[3,-3.1]].map(([m,dl])=>({d:back(m), o:o+dl, c:null, t:Object.fromEntries(CIADASH.TOOLS.map(t=>[t.k, DR[t.k].idx==null?null:Math.max(0,DR[t.k].idx+dl*(0.6+((t.k.length*7)%5)/5))]))})); }
function dCompute(){
  CIADASH.setLang(L);
  if(DEMO){ DR = {}; CIADASH.TOOLS.forEach(t=>{ const x = DEMO_RES[t.k]; DR[t.k] = x ? {st:x.st, idx:x.idx, comp:x.comp, m:x.m.map(([k,v,kind,d])=>({k,v,kind,d})), bd:x.bd} : {st:"none",idx:null,comp:null,m:[],bd:null}; }); }
  else DR = CIADASH.evalAll();
}
function dOverall(){
  const S = CIADASH.TOOLS.filter(t=>isSel(t.k) && DR[t.k] && DR[t.k].st==="ok" && DR[t.k].idx!=null);
  return {idx:dMean(S.map(t=>DR[t.k].idx)), comp:dMean(S.map(t=>DR[t.k].comp)), n:S.length, list:S,
    sel:CIADASH.TOOLS.filter(t=>isSel(t.k)).length, started:CIADASH.TOOLS.filter(t=>DR[t.k]&&DR[t.k].st==="ok").length};
}
function snapsNow(){ return DEMO ? demoSnaps() : DS.snaps; }

/* ---- rose ---- */
function roseSVG(){
  const u = dU(), C = 230, r0 = 74, R = 190, sel = CIADASH.TOOLS.filter(t=>isSel(t.k)), N = sel.length, dir = L==="ar" ? -1 : 1, ov = dOverall();
  const pt = (a,r) => [C + r*Math.cos(a), C + r*Math.sin(a)], A = t => -Math.PI/2 + dir*t;
  let g = "";
  [0.25,0.5,0.75,1].forEach(f=>g += `<circle cx="${C}" cy="${C}" r="${(r0+(R-r0)*f).toFixed(1)}" fill="none" stroke="rgba(255,255,255,${f===1?.16:.07})" stroke-width="1"/>`);
  g += `<circle cx="${C}" cy="${C}" r="${(r0+(R-r0)*0.7).toFixed(1)}" fill="none" stroke="#E2C46B" stroke-width="1.4" stroke-dasharray="2 5" opacity=".85"/>`;
  const sweep = dir>0 ? 1 : 0;
  sel.forEach((t,i)=>{
    const step = 2*Math.PI/Math.max(N,1), gap = N>1 ? 0.018 : 0, t0 = i*step+gap, t1 = (i+1)*step-gap - (N===1?0.0001:0);
    const r = DR[t.k], has = r && r.st==="ok" && r.idx!=null, rr = has ? r0 + (R-r0)*Math.max(0.02, r.idx/100) : R, col = DCOL[t.sys];
    const large = (t1-t0) > Math.PI ? 1 : 0;
    const path = rad => { const [x0,y0]=pt(A(t0),r0), [x1,y1]=pt(A(t0),rad), [x2,y2]=pt(A(t1),rad), [x3,y3]=pt(A(t1),r0);
      return `M${x0.toFixed(1)},${y0.toFixed(1)} L${x1.toFixed(1)},${y1.toFixed(1)} A${rad},${rad} 0 ${large} ${sweep} ${x2.toFixed(1)},${y2.toFixed(1)} L${x3.toFixed(1)},${y3.toFixed(1)} A${r0},${r0} 0 ${large} ${1-sweep} ${x0.toFixed(1)},${y0.toFixed(1)}Z`; };
    const tm = (t0+t1)/2, [lx,ly] = pt(A(tm), R+20), anc = Math.abs(lx-C) < 14 ? "middle" : (lx > C ? "start" : "end");
    const lab = esc(t.code), val = has ? `${Math.round(r.idx)}%` : "—";
    g += `<g class="wd" data-k="${t.k}" tabindex="0" role="button" aria-label="${esc(t.n[L])} — ${val}">
      <path d="${path(R)}" fill="rgba(255,255,255,.045)"/>
      ${has ? `<path class="wf" d="${path(rr)}" fill="${col}" stroke="${col}" stroke-width="0.5" style="animation-delay:${i*45}ms"/>` : `<path d="${path(R)}" fill="none" stroke="rgba(255,255,255,.25)" stroke-dasharray="3 4"/>`}
      <text x="${lx.toFixed(1)}" y="${(ly+4).toFixed(1)}" text-anchor="${anc}" font-size="14.5" font-weight="700" fill="${has?"#E9EEF7":"#7F8BA3"}" style="direction:ltr">${lab}</text></g>`;
  });
  if(!N) g += `<text x="${C}" y="${C-r0-40}" text-anchor="middle" font-size="14" fill="#AEBAD0">—</text>`;
  g += `<circle cx="${C}" cy="${C}" r="${r0-6}" fill="#101B31" stroke="#E2C46B" stroke-width="1.5"/>`;
  g += `<text id="rcV" x="${C}" y="${C+6}" text-anchor="middle" font-size="40" font-weight="700" fill="#fff" style="font-family:Fraunces,Georgia,serif;direction:ltr">${ov.idx==null?"—":Math.round(ov.idx)+"%"}</text>`;
  g += `<text id="rcL" x="${C}" y="${C+30}" text-anchor="middle" font-size="12.5" fill="#E2C46B">${esc(u.overall)}</text>`;
  return g;
}
function roseCenter(k){
  const v = document.getElementById("rcV"), l = document.getElementById("rcL"); if(!v||!l) return;
  if(k){ const t = dTool(k), r = DR[k]; v.textContent = r && r.idx!=null ? Math.round(r.idx)+"%" : "—"; l.textContent = t.code+" · "+(r&&r.st==="ok"?dU().bands[dBand(r.idx)]||"":dU().st.none); }
  else { const o = dOverall(); v.textContent = o.idx==null ? "—" : Math.round(o.idx)+"%"; l.textContent = dU().overall; }
}
function renderRose(){
  const svg = $("rose"); svg.setAttribute("aria-label", dU().roseAria); svg.innerHTML = roseSVG();
  svg.classList.toggle("grow", !dashGrown && !matchMedia("(prefers-reduced-motion:reduce)").matches && svg.dataset.seen==="1");
  if(svg.dataset.seen==="1") dashGrown = true;
  svg.querySelectorAll(".wd").forEach(g=>{
    const k = g.dataset.k;
    g.onmouseenter = g.onfocus = ()=>{ svg.classList.add("dim"); svg.querySelectorAll(".wd").forEach(x=>x.classList.toggle("hot", x===g)); roseCenter(k); };
    g.onmouseleave = g.onblur = ()=>{ svg.classList.remove("dim"); g.classList.remove("hot"); roseCenter(null); };
    g.onclick = ()=>dOpen(k);
    g.onkeydown = e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); dOpen(k); } };
  });
  const used = [...new Set(CIADASH.TOOLS.filter(t=>isSel(t.k)).map(t=>t.sys))];
  $("roseLeg").innerHTML = used.map(s=>`<span><i style="background:${DCOL[s]}"></i>${esc(dSys(s).short[L].join(" "))}</span>`).join("");
  $("roseCap").textContent = dU().roseCap;
}

/* ---- stats + ranking ---- */
function spark(vals, w, h, stroke){
  const v = vals.filter(x=>x!=null); if(v.length<2) return "";
  const mn = Math.min(...v)-3, mx = Math.max(...v)+3, n = vals.length;
  const P = vals.map((x,i)=>x==null?null:[ (L==="ar" ? w-(i/(n-1))*w : (i/(n-1))*w), h-((x-mn)/(mx-mn||1))*h ]).filter(Boolean);
  const d = P.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");
  const last = P[P.length-1];
  return `<svg class="spark" viewBox="-4 -4 ${w+8} ${h+8}" preserveAspectRatio="none" aria-hidden="true"><path d="${d}" fill="none" stroke="${stroke}" stroke-width="2" vector-effect="non-scaling-stroke"/><circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="3.5" fill="${stroke}"/></svg>`;
}
function renderSide(){

  }
  const last = snaps.length ? snaps[snaps.length-1] : null, delta = last && o.idx!=null ? o.idx - last.o : null;
  const ranked = o.list.slice().sort((a,b)=>DR[b.k].idx - DR[a.k].idx);
  const best = ranked[0], worst = ranked.length>1 ? ranked[ranked.length-1] : null;
  const trendBox = last
    ? `<b class="${delta>0.05?"up":delta<-0.05?"down":""}">${delta==null?"—":(delta>0?"+":"")+delta.toFixed(1)} <small style="display:inline;font-size:13px">${esc(u.pts)}</small></b>${spark([...snaps.map(s=>s.o), o.idx], 200, 30, "#E2C46B")}<small>${esc(last.d)}</small>${DEMO?"":`<button type="button" class="lnk" id="snapClr">${esc(u.clearSnaps)}</button>`}`

    `<div class="cs"><span class="k">${esc(u.started)}</span><b style="direction:ltr;text-align:start">${o.started} / ${total}</b><small>${esc(u.inIdx(o.n, o.sel))}</small></div>`+
    `<div class="cs"><span class="k">${esc(last?u.trend:u.noSnap)}</span>${trendBox}</div>`+
    `<div class="cs"><span class="k">${esc(u.focus)}</span>${best?`<div class="row"><span>${esc(u.strong)}: ${esc(best.code)}</span><em style="color:${BANDB[dBand(DR[best.k].idx)]}">${dR(DR[best.k].idx)}</em></div>`:"<b>—</b>"}${worst?`<div class="row"><span>${esc(u.weak)}: ${esc(worst.code)}</span><em style="color:${BANDB[dBand(DR[worst.k].idx)]}">${dR(DR[worst.k].idx)}</em></div>`:""}</div>`;
  const ns = CIADASH.TOOLS.filter(t=>isSel(t.k) && (!DR[t.k] || DR[t.k].st!=="ok"));
  $("ckRank").innerHTML = `<h3>${esc(u.rankT)}</h3><ol class="rk">${ranked.map(t=>{ const r=DR[t.k], b=dBand(r.idx);
      return `<li tabindex="0" data-k="${t.k}"><span class="nm"><i style="background:${DCOL[t.sys]}"></i><span>${esc(t.code)} · ${esc(t.n[L])}</span></span><span class="tr"><i style="width:${Math.max(2,Math.round(r.idx))}%;background:${BANDB[b]}"></i></span><em>${dR(r.idx)}</em></li>`; }).join("")}</ol>`+
    (ns.length ? `<div class="rk-ns">${esc(u.notStarted)} ${ns.map(t=>`<a href="${URLS[t.k]}" data-mod="${t.k}" data-modname="${esc(t.n[L])}">${esc(t.code)}</a>`).join("")}</div>` : "");
  $("ckRank").querySelectorAll("li[data-k]").forEach(li=>{ li.onclick=()=>dOpen(li.dataset.k); li.onkeydown=e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); dOpen(li.dataset.k); } }; });

        <ul class="dc-m">${ms.map(m=>`<li><span>${esc(CIADASH.ML[m.k][L])}</span><em>${Math.round(m.v)}%</em><i><b style="width:${Math.max(2,Math.round(m.v))}%;${m.kind==="prog"?"opacity:.45":""}"></b></i></li>`).join("")}</ul>`

/* ---- detail dialog ---- */
function ringSVG(v, col){
  const r = 62, c = 2*Math.PI*r, p = v==null ? 0 : Math.max(0,Math.min(100,v));
  return `<svg class="dd-ring" viewBox="0 0 150 150" aria-hidden="true"><circle cx="75" cy="75" r="${r}" fill="none" stroke="var(--line)" stroke-width="12"/>
    <circle cx="75" cy="75" r="${r}" fill="none" stroke="${col}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${(c*p/100).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 75 75)${L==="ar"?" scale(1 -1) translate(0 -150)":""}"/>
    <text x="75" y="84" text-anchor="middle" font-size="30" font-weight="700" fill="var(--ink)" style="font-family:Fraunces,Georgia,serif;direction:ltr">${v==null?"—":Math.round(v)+"%"}</text></svg>`;
}
function dOpen(k){

  const metric = m => { const lab = CIADASH.ML[m.k][L], mb = dBand(m.v);
    return `<li class="${m.v==null?"na":""}"><span class="kd" title="${esc(u.kindTxt[m.kind])}">${u.kinds[m.kind]}</span><span>${esc(lab)}</span><span class="v">${m.v==null?"—":Math.round(m.v)+"%"}${m.d?`<small>${esc(m.d)}</small>`:""}</span>
      <span class="tr"><b style="width:${m.v==null?0:Math.max(2,Math.round(m.v))}%;background:${m.kind==="perf"?`var(${BANDV[Math.max(0,mb)]})`:"var(--gold)"};${m.kind==="info"?"opacity:.5":""}"></b></span></li>`; };
  const bd = r.bd && r.bd.items && r.bd.items.length ? `<div class="dd-sec"><h4>${esc(r.bd.t[L])}</h4><div class="dd-bd">${r.bd.items.map(x=>`<div><span>${esc(typeof x.l==="object"?(x.l[L]||x.l.en):x.l)}</span><i><b style="width:${x.v==null?0:Math.max(2,Math.round(x.v))}%;background:${x.col||cssv(sys.color)}"></b></i><em>${x.v==null?"—":(x.t||Math.round(x.v)+"%")}</em></div>`).join("")}</div></div>` : "";
  const tr = tv.filter(x=>x!=null).length>1 ? `<div class="dd-sec dd-tr"><h4>${esc(u.trendT)}</h4>${spark(tv, 600, 60, cssv(sys.color)).replace('class="spark"','')}</div>` : "";
  dlg.innerHTML = `<div class="ddlg-h" style="--c:var(${sys.color})"><span class="dc-code">${esc(t.code)}</span><h3 id="dDlgT">${esc(t.n[L])}<small>${esc(sys.name[L])}${DEMO?" · "+esc(u.demoTag):""}</small></h3><button type="button" class="ddlg-x" id="dDlgX" aria-label="${esc(u.closeL)}">×</button></div>
    <div class="ddlg-b">
      <div class="dd-top">${ringSVG(r.idx, bcol)}<div class="dd-sum"><p><b>${esc(u.idxL)}</b>${b>=0?` · <span style="color:${bcol};font-weight:700">${esc(u.bands[b])}</span>`:""}</p><p>${esc(u.formula)}</p>
        ${r.comp!=null?`<div class="dd-comp"><span>${esc(u.comp)}</span><i><b style="width:${Math.round(r.comp)}%"></b></i><b style="direction:ltr">${Math.round(r.comp)}%</b></div>`:""}</div></div>
      <div class="dd-sec"><h4>${esc(u.mT)}</h4><ul class="dd-ms">${r.m.map(metric).join("")}</ul><p class="dd-key" style="margin-top:10px">${u.key.map(x=>`<span>${esc(x)}</span>`).join("")}</p></div>

}

/* ---- actions ---- */
const ICO_HELP=`<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.2a2.5 2.5 0 1 1 3.4 2.3c-.7.3-1 .8-1 1.5v.5M12 17h.01"/></svg>`;
const ICO_PRINT=`<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M6 9V3h12v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M6 14h12v7H6z"/></svg>`;
function renderActs(){
  const u = dU();
  $("dActs").innerHTML = `<button type="button" class="d-btn" id="dHelp">${ICO_HELP}${esc(u.help)}</button>
    <button type="button" class="d-btn" id="dRef"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg>${esc(u.refresh)}</button>
    <button type="button" class="d-btn gold" id="dSnap" ${DEMO?"disabled":""}>${esc(u.snap)}</button>
    <button type="button" class="d-btn" id="dPrint">${ICO_PRINT}${esc(u.print)}</button>
    <button type="button" class="d-btn" id="dCsv">${esc(u.csv)}</button>
    <button type="button" class="d-btn" id="dDemoBtn">${esc(DEMO?u.demoOff:u.demo)}</button>`;
  $("dHelp").onclick = dHelp;
  $("dPrint").onclick = dPrint;
  $("dRef").onclick = ()=>{ renderDash(); toast(u.refreshed); };
  $("dSnap").onclick = ()=>{ if(DEMO){ toast(u.snapNo); return; } const o = dOverall(); if(o.idx==null){ toast(u.noIdx); return; }
    const d = new Date(), p = n=>String(n).padStart(2,"0");
    DS.snaps.push({d:`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`, o:Math.round(o.idx*10)/10, c:o.comp==null?null:Math.round(o.comp*10)/10,
      t:Object.fromEntries(CIADASH.TOOLS.map(t=>[t.k, DR[t.k]&&DR[t.k].idx!=null ? Math.round(DR[t.k].idx*10)/10 : null]))});
    DS.snaps = DS.snaps.slice(-24); dSave(); renderDash(); toast(u.snapOk); };
  $("dCsv").onclick = dCsv;
  $("dDemoBtn").onclick = ()=>dDemo(!DEMO);
  const bn = $("ckBanner"); bn.hidden = !DEMO;
  bn.innerHTML = DEMO ? `<span>${esc(u.banner)}</span><button type="button" id="bnOff">${esc(u.demoOff)}</button>` : "";
  if(DEMO) $("bnOff").onclick = ()=>dDemo(false);
}
function dHelp(){
  const u = dU(), dlg = $("hDlg");
  dlg.innerHTML = `<div class="ddlg-h" style="--c:var(--gold)"><h3 id="hDlgT">${esc(u.hlpT)}</h3><button type="button" class="ddlg-x" id="hDlgX" aria-label="${esc(u.closeL)}">×</button></div>
    <div class="ddlg-b"><dl class="hlp">${u.hlp.map(([t,p])=>`<div><dt>${esc(t)}</dt><dd>${esc(p)}</dd></div>`).join("")}</dl>
    <div class="dd-f"><button type="button" class="btn primary" id="hDlgC">${esc(u.closeL)}</button></div></div>`;
  $("hDlgX").onclick = $("hDlgC").onclick = ()=>dlg.close();
  if(typeof dlg.showModal === "function"){ if(!dlg.open) dlg.showModal(); } else dlg.setAttribute("open","");
}
function dPrint(){
  const u = dU(), o = dOverall(), d = new Date(), root = document.documentElement;
  const ds = d.toLocaleDateString(L==="ar"?"ar-EG-u-nu-latn":"en-GB",{year:"numeric",month:"long",day:"numeric"});
  $("printHead").innerHTML = `<img src="${document.querySelector(".brand img").src}" alt=""><div><b>${esc(UI[L].brand)}</b><span>${esc(u.title)}${DEMO?" · "+esc(u.demoTag):""}</span><span>${esc(u.printedOn)}: ${esc(ds)}</span></div>
    <div class="ph-r"><b>${o.idx==null?"—":Math.round(o.idx)+"%"}</b><span>${esc(u.overall)}</span></div>`;
  const prevTheme = root.getAttribute("data-theme");
  root.classList.add("pdash"); root.setAttribute("data-theme","light");
  const done = ()=>{ root.classList.remove("pdash"); if(prevTheme==null) root.removeAttribute("data-theme"); else root.setAttribute("data-theme",prevTheme); window.removeEventListener("afterprint", done); };
  window.addEventListener("afterprint", done);
  setTimeout(()=>{ try{ window.print(); }catch(e){ done(); } }, 80);
}

function dDemo(on){ DEMO = !!on; renderDash(); }
function dCsv(){
  const u = dU(), o = dOverall(), rows = [u.csvH];
  const cell = v => { v = String(v??"").replace(/\r?\n/g," "); return /[",;]/.test(v) ? `"${v.replace(/"/g,'""')}"` : v; };
  const r1 = v => v==null ? "" : (Math.round(v*10)/10);
  rows.push([u.overall, "", "", DEMO?u.demoTag:"", r1(o.idx), r1(o.comp), "", "", "", ""]);
  CIADASH.TOOLS.forEach(t=>{ const r = DR[t.k]||{st:"none",m:[]}, base = [`${t.code} ${t.n[L]}`, dSys(t.sys).name[L], isSel(t.k)?"✓":"", u.st[r.st]||"", r1(r.idx), r1(r.comp)];
    if(!r.m.length) rows.push([...base,"","","",""]);
    r.m.forEach(m=>rows.push([...base, CIADASH.ML[m.k][L], r1(m.v), m.d||"", u.kindTxt[m.kind]])); });
  const blob = new Blob(["\ufeff"+rows.map(r=>r.map(cell).join(",")).join("\r\n")], {type:"text/csv;charset=utf-8"});
  const a = document.createElement("a"), url = URL.createObjectURL(blob);
  a.href = url; a.download = `CIA-performance-dashboard-${new Date().toISOString().slice(0,10)}.csv`; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url), 2000);
}
function renderDash(){
  try{
    dCompute();
    const u = dU(); $("dTitle").textContent = u.title; $("dSub").textContent = u.sub;
    renderActs(); renderRose(); renderSide(); renderCards();
    const dEmpty = !DEMO && dOverall().started===0; document.querySelector("#dash .d-bar").hidden = dEmpty; $("dCards").hidden = dEmpty;
    const dlg = $("dDlg"); if(dlg && dlg.open && dlg.dataset.k) dOpen(dlg.dataset.k);
    dashDirty = false;
  }catch(e){ console.error(e); }
  try{ renderWheel(); }catch(e){ console.error(e); }
}
function dashRefresh(){ if($("modOverlay").classList.contains("on")){ dashDirty = true; return; } renderDash(); }
(function(){
  let tmr = null;
  window.addEventListener("storage", e=>{ if(e.key && e.key!==DSTORE && !CIADASH.TOOLS.some(t=>t.key===e.key)) return; clearTimeout(tmr); tmr = setTimeout(dashRefresh, 350); });
  document.addEventListener("visibilitychange", ()=>{ if(!document.hidden && !DEMO) dashRefresh(); });
  const dlg = $("dDlg");
  dlg.addEventListener("click", e=>{ if(e.target===dlg) dlg.close(); const a = e.target.closest("a[data-mod]"); if(a) dlg.close(); });
  const obs = "IntersectionObserver" in window ? new IntersectionObserver(es=>{ es.forEach(en=>{ if(en.isIntersecting){ const s=$("rose"); s.dataset.seen="1"; if(!dashGrown){ renderRose(); } obs.disconnect(); } }); }, {threshold:.25}) : null;
  if(obs) obs.observe($("cockpit")); else { $("rose").dataset.seen="1"; dashGrown = true; }
})();

/* init */
(function(){
  const q = new URLSearchParams(location.search).get("lang");
  let saved = null; try{ saved = localStorage.getItem("cia-lang"); }catch(e){}
  if(q==="ar"||q==="en") L=q; else if(saved==="ar"||saved==="en") L=saved;
  try{ localStorage.setItem("cia-lang", L); }catch(e){}
  renderAll(true);
  const m = location.hash.match(/^#m=([\w-]+)/);
  if(m && URLS[m[1]]) { showView("home"); openModule(m[1], false); }
  else route(location.hash, false);
  /* the guided tour now starts only from "Start here" (no pop-up over the wheel on the first visit) */
})();
</script>
